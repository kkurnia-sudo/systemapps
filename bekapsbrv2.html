<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DB Manager</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/feather-icons"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #f4f4f5;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --accent-blue: #3b82f6;
            --accent-blue-hover: #2563eb;
            --btn-dark: #0f172a;
            --btn-dark-hover: #334155;
            --btn-light: #f1f5f9;
            --btn-light-hover: #e2e8f0;
            --btn-danger: #ef4444;
            --btn-danger-hover: #dc2626;
        }

        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg-color); color: var(--text-main); margin: 0; padding: 16px; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; }
        .app-container { background-color: var(--card-bg); width: 100%; max-width: 480px; border-radius: 24px; padding: 32px 24px; box-shadow: 0 10px 40px -10px rgba(0,0,0,0.08); box-sizing: border-box; margin-top: 20px; }
        .header { display: flex; flex-direction: column; align-items: center; text-align: center; margin-bottom: 32px; }
        .header-icons { display: flex; flex-direction: row; align-items: center; gap: 16px; margin-bottom: 12px; }
        .header-icons i { color: var(--accent-blue); font-size: 32px; }
        .header h2 { margin: 0; font-size: 1.5rem; font-weight: 700; letter-spacing: -0.02em; }
        .subtitle-text { color: var(--text-muted); font-size: 1rem; font-weight: 500; margin: 8px 0 0 0; }
        
        /* Mengembalikan proporsi lebar 32% dan sisa ruang */
        .restore-row { display: flex; gap: 10px; margin-bottom: 24px; }
        .restore-row .source-col { flex: 0 0 32%; margin-bottom: 0; }
        .restore-row .target-col { flex: 1; margin-bottom: 0; }
        .restore-row label { font-size: 0.75rem; }
        
        .status-badge { display: inline-flex; align-items: center; justify-content: center; gap: 8px; background-color: #ecfdf5; color: #059669; padding: 6px 14px; border-radius: 999px; font-size: 0.75rem; font-weight: 700; letter-spacing: 0.05em; margin-top: 16px; }
        .pulse-dot { width: 8px; height: 8px; background-color: #10b981; border-radius: 50%; box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); animation: pulse 2s infinite; }
        @keyframes pulse { 0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); } 70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); } 100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); } }

        .input-group { margin-bottom: 24px; }
        .input-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 8px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }
        select, input[type="file"] {
            width: 100%;
            height: 54px; /* <-- Tambahkan ini untuk mengunci tinggi ke bawah */
            padding: 12px 16px; /* <-- Padding atas bawah dikurangi sedikit agar pas dengan height */
            background-color: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            font-size: 16px;
            color: var(--text-main);
            outline: none;
            transition: all 0.2s ease;
            box-sizing: border-box;
            appearance: none;
        }
        select { background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%2364748b%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E"); background-repeat: no-repeat; background-position: right 16px top 50%; background-size: 12px auto; }
        input[type="file"]::file-selector-button { background-color: var(--btn-light); border: none; padding: 8px 12px; border-radius: 8px; color: var(--text-main); font-weight: 600; margin-right: 12px; cursor: pointer; transition: background 0.2s; }

        .btn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; padding: 16px; border: none; border-radius: 12px; font-size: 0.95rem; font-weight: 600; cursor: pointer; transition: all 0.2s ease; box-sizing: border-box; }
        .btn:active { transform: scale(0.98); }
        .btn i { width: 20px; height: 20px; }

        /* Pengaturan Layout Tombol Berdampingan */
        .action-row { display: flex; gap: 10px; margin-top: 12px; margin-bottom: 12px;}
        .action-row .btn { margin-top: 0; flex: 1; padding: 14px 10px; font-size: 0.85rem;}

        .btn-primary { background-color: var(--btn-dark); color: white; margin-top: 12px;}
        .btn-primary:hover { background-color: var(--btn-dark-hover); }
        .btn-secondary { background-color: var(--accent-blue); color: white; margin-top: 12px; }
        .btn-secondary:hover { background-color: var(--accent-blue-hover); }
        .btn-warning { background-color: #f59e0b; color: white; margin-top: 12px; }
        .btn-warning:hover { background-color: #d97706; }
        .btn-danger { background-color: var(--btn-danger); color: white; margin-top: 0;}
        .btn-danger:hover { background-color: var(--btn-danger-hover); }
        .btn-light { background-color: var(--btn-light); color: var(--text-main); margin-top: 0 !important; }
        .btn-light:hover { background-color: var(--btn-light-hover); }

        .divider { height: 1px; background-color: var(--border-color); margin: 32px 0; position: relative; }
        .divider span { position: absolute; top: -10px; left: 50%; transform: translateX(-50%); background: var(--card-bg); padding: 0 16px; color: var(--text-muted); font-size: 0.8rem; font-weight: 600; }        
        
        .log-area { margin-top: 24px; padding: 16px; background: #f8fafc; border: 1px dashed var(--border-color); border-radius: 12px; font-size: 0.85rem; color: var(--text-muted); min-height: 40px; font-family: monospace; word-wrap: break-word; line-height: 1.5; }
        .success-text { color: #10b981; font-weight: 600; }
        .error-text { color: #ef4444; font-weight: 600; }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(2px); opacity: 0; pointer-events: none; transition: opacity 0.3s ease; z-index: 1000; }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .bottom-sheet { position: fixed; bottom: 0; left: 0; width: 100%; background: var(--card-bg); border-radius: 24px 24px 0 0; padding: 24px 24px 32px 24px; box-sizing: border-box; transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); z-index: 1001; box-shadow: 0 -10px 40px rgba(0,0,0,0.1); }
        .bottom-sheet.active { transform: translateY(0); }
        .sheet-handle { width: 40px; height: 5px; background-color: var(--border-color); border-radius: 10px; margin: 0 auto 20px auto; }
        .sheet-header { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; margin-bottom: 16px; text-align: center; }
        .sheet-title { margin: 0 !important; font-size: 1.25rem; font-weight: 700; text-align: center; }
        .sheet-icon { display: flex; align-items: center; justify-content: center; width: 64px; height: 64px; border-radius: 50%; flex-shrink: 0; }
        .sheet-icon svg { width: 32px; height: 32px; }
        .sheet-icon.warning { background-color: #fef3c7; color: #d97706; }
        .sheet-icon.info { background-color: #e0f2fe; color: #2563eb; }
        .sheet-icon.danger { background-color: #fee2e2; color: #ef4444; }
        .sheet-message { margin: 0 0 24px 0; color: var(--text-muted); font-size: 0.95rem; line-height: 1.5; text-align: center; }
        .sheet-actions { display: flex; gap: 12px; }
        .sheet-actions .btn { flex: 1; margin-top: 0; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <div class="header-icons">
            <i class="fa-solid fa-file-shield"></i>
            <i class="fa-solid fa-server"></i>
            <i class="fa-solid fa-database"></i>
        </div>
        <h2>Data Manager</h2>
        <p class="subtitle-text">Sbr Systems</p>
        <div class="status-badge">
            <span class="pulse-dot"></span>
            Sistem Online
        </div>
    </div>

    <!-- AREA BACKUP -->
    <div class="input-group">
        <label for="tableSelect">Pilih Tabel Sumber</label>
        <select id="tableSelect">
            <option value="semua">📚 (Master Backup) SEMUA TABEL</option>
            <option value="agen">agen</option>
            <option value="barang">barang</option>
            <option value="harga">harga</option>
            <option value="rekap_laporan_driver">rekap_laporan_driver</option>
            <option value="transaksi">transaksi</option>
            <option value="transaksi_dp">transaksi_dp</option>
            <option value="transaksi_detail">transaksi_detail</option>
            <option value="transaksi_detaildp">transaksi_detaildp</option>
        </select>
    </div>

    <!-- Layout Side to Side (Backup) -->
    <div class="action-row">
        <button class="btn btn-primary" onclick="backupData()">
            <i data-feather="download-cloud"></i> Backup (JSON)
        </button>
        <button class="btn btn-warning" onclick="backupAndClearData()">
            <i data-feather="archive"></i> Backup & Reset Table
        </button>
    </div>

    <!-- Tombol Tambahan: Reset ID -->
    <button class="btn btn-danger" onclick="resetSequence()">
        <i data-feather="refresh-cw"></i> Reset ID Tabel (WAJIB KETIKA SUDAH RESET)
    </button>

    <div class="divider">
        <span>R E S T O R E</span>
    </div>
    
    <!-- AREA RESTORE SIDE-BY-SIDE -->
    <div class="restore-row">
        <div class="input-group source-col">
            <label for="restoreSource">Sumber</label>
            <select id="restoreSource" onchange="toggleRestoreSource()">
                <option value="local">📁 Perangkat</option>
                <option value="cloud">☁️ Cloud</option>
            </select>
        </div>

        <div class="input-group target-col" id="localFileGroup">
            <label for="fileRestore">File JSON</label>
            <input type="file" id="fileRestore" accept=".json">
        </div>

        <div class="input-group target-col" id="cloudBackupGroup" style="display: none;">
            <label for="cloudBackupSelect">Riwayat Cloud</label>
            <select id="cloudBackupSelect">
                <option value="">-- Pilih --</option>
            </select>
        </div>
    </div>

    <button class="btn btn-secondary" onclick="restoreData()">
        <i data-feather="upload-cloud"></i> Jalankan Restore Data
    </button>

    <!-- AREA LOG/STATUS -->
    <div class="log-area" id="logArea">
        <span style="color: var(--text-muted)">// Menunggu instruksi...</span>
    </div>
</div> 

<!-- WADAH BOTTOM SHEET -->
<div id="modalOverlay" class="modal-overlay"></div>
<div id="bottomSheet" class="bottom-sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-header">
        <div id="sheetIcon" class="sheet-icon"></div>
        <h3 class="sheet-title">Konfirmasi</h3>
    </div>
    <p class="sheet-message" id="sheetMessage">Pesan konfirmasi di sini...</p>
    <div class="sheet-actions">
        <button class="btn btn-light" id="btnCancel">Batal</button>
        <button class="btn btn-warning" id="btnConfirm">Lanjutkan</button>
    </div>
</div>

<script>
    feather.replace();

    // Pastikan Key ini rahasia, disarankan menggunakan environment variable pada sisi backend
    const SUPABASE_URL = "https://yxcxvkairftqzmptkorr.supabase.co";
    const SUPABASE_KEY ="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl4Y3h2a2FpcmZ0cXptcHRrb3JyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc3OTA0OTMsImV4cCI6MjA5MzM2NjQ5M30.t1l-EbUrTW_mz4sQfWG3vr6RER2_rdp3cSkfKWigGUs"; 
    
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const logArea = document.getElementById('logArea');

    function log(message, isError = false) {
        const time = new Date().toLocaleTimeString('id-ID', { hour12: false });
        logArea.innerHTML = `<span class="${isError ? 'error-text' : 'success-text'}">[${time}] ${message}</span>`;
    }

    function triggerDownload(content, filename) {
        const blob = new Blob([content], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        a.click();
        URL.revokeObjectURL(url);
    }
    
    async function fetchAllRows(tableName) {
        let allRows = [];
        let from = 0;
        const limit = 1000; 
        let to = limit - 1;
        let keepFetching = true;

        while (keepFetching) {
            const { data, error } = await supabaseClient.from(tableName).select('*').range(from, to);
            if (error) throw error;
            if (data && data.length > 0) {
                allRows = allRows.concat(data); 
                if (data.length < limit) {
                    keepFetching = false; 
                } else {
                    from += limit;
                    to += limit;
                }
            } else {
                keepFetching = false;
            }
        }
        return allRows;
    }

    const delay = ms => new Promise(res => setTimeout(res, ms));

    function resetBottomSheetUI() {
        document.getElementById('btnConfirm').innerText = 'Lanjutkan';
        document.getElementById('btnCancel').innerText = 'Batal';
    }

    function customConfirm(message, isWarning = false, isDanger = false) {
        return new Promise((resolve) => {
            const overlay = document.getElementById('modalOverlay');
            const sheet = document.getElementById('bottomSheet');
            const msgEl = document.getElementById('sheetMessage');
            const btnCancel = document.getElementById('btnCancel');
            const btnConfirm = document.getElementById('btnConfirm');
            const iconContainer = document.getElementById('sheetIcon');

            resetBottomSheetUI(); 
            msgEl.innerText = message; 
            
            if (isDanger) {
                btnConfirm.className = 'btn btn-danger';
                iconContainer.className = 'sheet-icon danger';
                iconContainer.innerHTML = '<i data-feather="alert-octagon"></i>';
            } else if (isWarning) {
                btnConfirm.className = 'btn btn-warning';
                iconContainer.className = 'sheet-icon warning';
                iconContainer.innerHTML = '<i data-feather="alert-triangle"></i>';
            } else {
                btnConfirm.className = 'btn btn-primary';
                iconContainer.className = 'sheet-icon info';
                iconContainer.innerHTML = '<i data-feather="info"></i>';
            }
            
            feather.replace();
            overlay.classList.add('active');
            sheet.classList.add('active');

            const closeSheet = () => {
                overlay.classList.remove('active');
                sheet.classList.remove('active');
                cleanup();
            };

            const onConfirm = () => { closeSheet(); resolve(true); };
            const onCancel = () => { closeSheet(); resolve(false); };

            const cleanup = () => {
                btnConfirm.removeEventListener('click', onConfirm);
                btnCancel.removeEventListener('click', onCancel);
                overlay.removeEventListener('click', onCancel);
            };

            btnConfirm.addEventListener('click', onConfirm);
            btnCancel.addEventListener('click', onCancel);
            overlay.addEventListener('click', onCancel);
        });
    }
    
    function customTableSelector(tables, title = 'Pilih Tabel', desc = 'Centang tabel:', btnText = 'Lanjutkan') {
        return new Promise((resolve) => {
            const overlay = document.getElementById('modalOverlay');
            const sheet = document.getElementById('bottomSheet');
            const msgEl = document.getElementById('sheetMessage');
            const btnCancel = document.getElementById('btnCancel');
            const btnConfirm = document.getElementById('btnConfirm');
            const iconContainer = document.getElementById('sheetIcon');

            document.querySelector('.sheet-title').innerText = title;
            iconContainer.className = 'sheet-icon info';
            iconContainer.innerHTML = '<i data-feather="check-square"></i>';

            let html = `<p style="margin-bottom:12px; font-size:0.9rem; color:var(--text-muted);">${desc}</p>`;
            html += '<div style="max-height: 220px; overflow-y: auto; text-align: left; margin-bottom: 20px; padding-right: 4px;">';
            tables.forEach(table => {
                html += `<label style="display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border-color); font-weight: 500; cursor: pointer; color: var(--text-main);">
                    <input type="checkbox" value="${table}" checked style="width: 20px; height: 20px; accent-color: var(--accent-blue);"> ${table}
                </label>`;
            });
            html += '</div>';

            msgEl.innerHTML = html; 
            btnConfirm.className = 'btn btn-primary';
            btnConfirm.innerText = btnText;
            btnCancel.innerText = 'Batal';

            feather.replace();
            overlay.classList.add('active');
            sheet.classList.add('active');

            const closeSheet = (selectedTables) => {
                overlay.classList.remove('active');
                sheet.classList.remove('active');
                document.querySelector('.sheet-title').innerText = 'Konfirmasi'; 
                cleanup();
                resolve(selectedTables);
            };

            const onConfirm = () => {
                const checkboxes = sheet.querySelectorAll('input[type="checkbox"]:checked');
                const selected = Array.from(checkboxes).map(cb => cb.value);
                closeSheet(selected);
            };
            const onCancel = () => closeSheet(null);

            const cleanup = () => {
                btnConfirm.removeEventListener('click', onConfirm);
                btnCancel.removeEventListener('click', onCancel);
                overlay.removeEventListener('click', onCancel);
            };

            btnConfirm.addEventListener('click', onConfirm);
            btnCancel.addEventListener('click', onCancel);
            overlay.addEventListener('click', onCancel);
        });
    }

    async function backupData() {
        const tableSelect = document.getElementById('tableSelect');
        const selectedValue = tableSelect.value;
        const dateStr = new Date().toISOString().split('T')[0];

        try {
            let payloadToSave = null;
            let tablesToProcess = [];

            if (selectedValue === 'semua') {
                const availableTables = Array.from(tableSelect.options).map(opt => opt.value).filter(val => val !== 'semua');
                const selectedTables = await customTableSelector(availableTables, 'Pilih Tabel Backup', 'Centang tabel yang ingin di-backup:', 'Backup Terpilih');
                
                if (!selectedTables || selectedTables.length === 0) {
                    log('Backup dibatalkan.', true);
                    return;
                }
                
                tablesToProcess = selectedTables;
                log(`Mengambil data dari ${tablesToProcess.length} tabel secara bertahap...`);
                
                let allData = {};
                for (const table of tablesToProcess) {
                    const data = await fetchAllRows(table); 
                    allData[table] = data || [];
                }

                payloadToSave = allData;
                triggerDownload(JSON.stringify(allData, null, 2), `Master_Backup_${dateStr}.json`);
            } else {
                tablesToProcess = [selectedValue];
                log(`Memulai backup ${selectedValue}...`);
                const data = await fetchAllRows(selectedValue); 
                
                if (!data || data.length === 0) {
                    log(`Tabel ${selectedValue} kosong.`, true);
                    return;
                }
                payloadToSave = data;
                triggerDownload(JSON.stringify(data, null, 2), `Backup_${selectedValue}_${dateStr}.json`);
            }

            log('Menyimpan salinan ke cloud...');
            const { error: insertError } = await supabaseClient.from('system_backups').insert([{
                backup_type: selectedValue === 'semua' ? 'master_terpilih' : selectedValue,
                data_payload: payloadToSave,
                created_at: new Date().toISOString()
            }]);

            if (insertError) log(`✓ Download sukses, gagal simpan cloud: ${insertError.message}`, true);
            else log(`✓ Berhasil! File ter-download & tersimpan di cloud.`);

        } catch (err) { log(`✗ Gagal backup: ${err.message}`, true); }
    }

    async function backupAndClearData() {
        const tableSelect = document.getElementById('tableSelect');
        const selectedValue = tableSelect.value;
        const dateStr = new Date().toISOString().split('T')[0];
        let tablesToProcess = [];
        
        if (selectedValue === 'semua') {
            const availableTables = Array.from(tableSelect.options).map(opt => opt.value).filter(val => val !== 'semua');
            const selectedTables = await customTableSelector(availableTables, 'Pilih Tabel Archive', 'Centang tabel yang akan dibackup & dibersihkan:', 'Pilih & Lanjutkan');
            if (!selectedTables || selectedTables.length === 0) return;
            tablesToProcess = selectedTables;
        } else {
            tablesToProcess = [selectedValue];
        }

        const tableNameText = selectedValue === 'semua' ? `${tablesToProcess.length} tabel terpilih` : `tabel ${selectedValue}`;
        const msg1 = `BAHAYA: Anda akan mem-backup sekaligus MENGHAPUS data di ${tableNameText}. Lanjutkan?`;
        const isConfirmed = await customConfirm(msg1, true, true);
        if (!isConfirmed) return;

        try {
            let dataToBackup = {};
            log(`Mengumpulkan data secara bertahap...`);
            for (const table of tablesToProcess) {
                const data = await fetchAllRows(table); 
                dataToBackup[table] = data || [];
            }
            
            const filePrefix = selectedValue === 'semua' ? 'Master_Archive' : `Archive_${selectedValue}`;
            triggerDownload(JSON.stringify(dataToBackup, null, 2), `${filePrefix}_${dateStr}.json`);

            const { error: insertError } = await supabaseClient.from('system_backups').insert([{
                backup_type: selectedValue === 'semua' ? 'archive_terpilih' : selectedValue,
                data_payload: dataToBackup,
                created_at: new Date().toISOString()
            }]);

            await delay(1500);
            const finalConfirm = await customConfirm(`File JSON sudah di-download! Lanjutkan MENGHAPUS data?`, true, true);
                
            if (finalConfirm) {
                log('Memulai pembersihan data...');
                for (const table of tablesToProcess) {
                    const tableData = dataToBackup[table];
                    if (table === 'transaksi' || table === 'transaksi_dp') {
                        const { error } = await supabaseClient.from(table).delete().eq('sisa_akhir', 0);
                        if (!error) log(`✓ Invoice lunas (sisa = 0) di tabel ${table} berhasil dibersihkan.`);
                    } else if (table === 'transaksi_detail' || table === 'transaksi_detaildp') {
                        log(`✓ Tabel ${table} dibersihkan otomatis (Cascade).`);
                    } else if (table === 'agen' || table === 'barang' || table === 'harga') {
                        log(`- Tabel ${table} adalah data master. Dilewati.`);
                    } else if (tableData && tableData.length > 0) {
                        const primaryKey = tableData[0].id !== undefined ? 'id' : Object.keys(tableData[0])[0];
                        const { error } = await supabaseClient.from(table).delete().not(primaryKey, 'is', null);
                        if (!error) log(`✓ Data di tabel ${table} berhasil dikosongkan.`);
                    }
                }
                log(`✓ Proses Archive Selesai!`);
            }
        } catch (err) { log(`✗ Gagal memproses data: ${err.message}`, true); }
    }

    // --- FUNGSI BARU: RESET SEQUENCE ID ---
    async function resetSequence() {
        const tableSelect = document.getElementById('tableSelect');
        const availableTables = Array.from(tableSelect.options).map(opt => opt.value).filter(val => val !== 'semua');
        
        // Memunculkan pop-up pemilihan tabel
        const selectedTables = await customTableSelector(
            availableTables, 
            'Pilih Tabel', 
            'Centang tabel yang urutan ID-nya ingin di-reset melanjutkan nomor terakhir:', 
            'Reset ID Tabel'
        );
        
        if (!selectedTables || selectedTables.length === 0) {
            log('Proses Reset ID dibatalkan.', true);
            return;
        }

        const isConfirmed = await customConfirm(`Anda yakin ingin me-reset urutan ID untuk ${selectedTables.length} tabel terpilih?`, false, true);
        if (!isConfirmed) return;

        log(`Memulai sinkronisasi ulang urutan ID...`);
        
        for (const table of selectedTables) {
            // Memanggil fungsi RPC (SQL) di Supabase
            const { error } = await supabaseClient.rpc('reset_table_sequence', { t_name: table });
            
            if (error) {
                log(`✗ Gagal reset ID tabel ${table}: ${error.message} (Apakah function SQL sudah dibuat?)`, true);
            } else {
                log(`✓ Sequence ID tabel ${table} berhasil dilanjutkan dari urutan terakhir.`);
            }
        }
    }

    function toggleRestoreSource() {
        const source = document.getElementById('restoreSource').value;
        const localGroup = document.getElementById('localFileGroup');
        const cloudGroup = document.getElementById('cloudBackupGroup');

        if (source === 'local') { localGroup.style.display = 'block'; cloudGroup.style.display = 'none'; } 
        else { localGroup.style.display = 'none'; cloudGroup.style.display = 'block'; fetchCloudBackups(); }
    }

    async function fetchCloudBackups() {
        const cloudSelect = document.getElementById('cloudBackupSelect');
        cloudSelect.innerHTML = '<option value="">Memuat daftar dari cloud...</option>';
        try {
            const { data, error } = await supabaseClient.from('system_backups').select('id, backup_type, created_at').order('created_at', { ascending: false }).limit(20);
            if (error) throw error;
            if (!data || data.length === 0) { cloudSelect.innerHTML = '<option value="">Tidak ada riwayat.</option>'; return; }
            cloudSelect.innerHTML = '<option value="">-- Pilih Waktu & Tipe Backup --</option>';
            data.forEach(item => {
                const dateFormatted = new Date(item.created_at).toLocaleString('id-ID');
                const option = document.createElement('option');
                option.value = item.id;
                option.textContent = `[${item.backup_type.toUpperCase()}] - ${dateFormatted}`;
                cloudSelect.appendChild(option);
            });
        } catch (err) { cloudSelect.innerHTML = '<option value="">Gagal memuat data cloud</option>'; }
    }

    async function restoreData() {
        let selectedValue = document.getElementById('tableSelect').value;
        const restoreSource = document.getElementById('restoreSource').value;

        try {
            let jsonData = null;
            let fileNameOrType = ''; 

            if (restoreSource === 'local') {
                const file = document.getElementById('fileRestore').files[0];
                if (!file) { log('✗ Harap pilih file JSON!', true); return; }
                fileNameOrType = file.name;
                jsonData = await new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = e => resolve(JSON.parse(e.target.result));
                    reader.onerror = () => reject(new Error('Gagal membaca file.'));
                    reader.readAsText(file);
                });
            } else {
                const backupId = document.getElementById('cloudBackupSelect').value;
                if (!backupId) { log('✗ Harap pilih riwayat cloud!', true); return; }
                const { data, error } = await supabaseClient.from('system_backups').select('backup_type, data_payload').eq('id', backupId).single();
                if (error) throw error;
                jsonData = data.data_payload; fileNameOrType = data.backup_type; 
            }

            if (Array.isArray(jsonData)) {
                let targetTable = selectedValue;
                if (restoreSource === 'local') {
                    const match = fileNameOrType.match(/(?:Backup|Archive|Master)_([a-zA-Z0-9_]+)_\d{4}-\d{2}-\d{2}/);
                    if (match && match[1] && !['semua', 'all', 'Archive'].includes(match[1])) targetTable = match[1];
                } else {
                    if (fileNameOrType && !['semua', 'archive_semua'].includes(fileNameOrType)) targetTable = fileNameOrType.replace('archive_', '');
                }

                if (targetTable === 'semua') { log('✗ Mode SEMUA TABEL tidak valid untuk 1 tabel.', true); return; }
                log(`Memulai restore ke tabel: ${targetTable}...`);
                const { error } = await supabaseClient.from(targetTable).upsert(jsonData);
                if (error) throw error;
                log(`✓ Data dimasukkan ke tabel ${targetTable}.`);

            } else if (typeof jsonData === 'object') {
                const tablesInFile = Object.keys(jsonData);
                const selectedTables = await customTableSelector(tablesInFile, 'Pilih Tabel Restore', 'Centang tabel:', 'Restore Terpilih');
                if (!selectedTables || selectedTables.length === 0) return;

                const urutanTabel = { 'agen': 1, 'barang': 2, 'harga': 3, 'transaksi': 4, 'transaksi_dp': 5, 'rekap_laporan_driver': 6, 'transaksi_detail': 7, 'transaksi_detaildp': 8 };
                selectedTables.sort((a, b) => (urutanTabel[a] || 99) - (urutanTabel[b] || 99));

                log(`Memulihkan ${selectedTables.length} tabel berurutan...`);
                for (const table of selectedTables) {
                    const tableData = jsonData[table];
                    if (tableData && tableData.length > 0) {
                        const { error } = await supabaseClient.from(table).upsert(tableData);
                        if (error) throw error;
                        log(`✓ Tabel ${table} berhasil dipulihkan.`);
                    }
                }
                log(`✓ Semua tabel terpilih berhasil di-restore!`);
            }
        } catch (err) { log(`✗ Gagal restore: ${err.message}`, true); }
    }
</script>
