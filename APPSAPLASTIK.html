<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List P.O Plastik Surya Abadi</title>
    <style>
        /* Desain Modern & Minimalis */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: #f3f4f6;
            margin: 0;
            padding: 12px 8px;
            color: #1f2937;
        }
        .container {
            max-width: 600px;
            background: #ffffff;
            padding: 20px 16px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
            margin: auto;
        }
        h2 {
            text-align: center;
            color: #111827;
            margin: 0 0 16px 0;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -0.3px;
        }
        .form-group {
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #f9fafb;
            padding: 10px 12px;
            border-radius: 8px;
        }
        .form-group label {
            font-weight: 600;
            color: #4b5563;
            font-size: 13px;
        }
        select {
            width: 50%;
            padding: 8px;
            border: 1px solid #e5e7eb;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            background-color: #fff;
            color: #111827;
            outline: none;
            cursor: pointer;
        }
        .header-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 20px 0 10px 0;
        }
        .section-title {
            font-weight: 700;
            color: #2563eb;
            font-size: 13px;
        }
        .btn-edit {
            background-color: #f3f4f6;
            color: #4b5563;
            border: 1px solid #e5e7eb;
            padding: 6px 10px;
            font-size: 11px;
            font-weight: 700;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-edit:hover {
            background-color: #e5e7eb;
        }
        .btn-edit.active {
            background-color: #fef3c7;
            color: #d97706;
            border-color: #fde68a;
        }
        .info-rumus {
            font-size: 11px;
            color: #6b7280;
            margin-bottom: 12px;
            background: #f8fafc;
            padding: 8px 10px;
            border-radius: 6px;
            border: 1px solid #f1f5f9;
        }
        .item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
        }
        .item-info {
            font-weight: 700;
            color: #374151;
            font-size: 13px;
            flex-grow: 1;
        }
        .input-group {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-left: 8px;
        }
        .input-group label {
            font-size: 10px;
            color: #9ca3af;
            font-weight: 600;
            width: 22px;
        }
        input[type="number"] {
            width: 48px;
            padding: 6px 4px;
            border: 1px solid transparent;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 13px;
            font-weight: 600;
            text-align: center;
            background-color: #f3f4f6;
            color: #1f2937;
            outline: none;
            transition: all 0.2s;
        }
        
        /* MENGHILANGKAN SPINNER (Panah Atas/Bawah) PADA INPUT NUMBER */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
        input[type=number] {
            -moz-appearance: textfield; /* Untuk Firefox */
        }

        input[type="number"]:focus {
            border-color: #93c5fd;
            background-color: #fff;
        }
        input[type="number"]:disabled {
            background-color: transparent;
            color: #9ca3af;
        }
        /* Style khusus untuk kolom estimasi PO */
        .est-input {
            background-color: #eff6ff !important;
            color: #2563eb !important;
            font-weight: 700 !important;
        }
        .section-divider {
            border: 0;
            border-top: 1px dashed #e5e7eb;
            margin: 16px 0;
        }
        .btn-whatsapp {
            background-color: #10b981;
            color: white;
            border: none;
            padding: 14px;
            font-size: 14px;
            font-weight: 700;
            width: 100%;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s, transform 0.1s;
            margin-top: 20px;
            box-shadow: 0 4px 6px rgba(16, 185, 129, 0.2);
        }
        .btn-whatsapp:hover {
            background-color: #059669;
        }
        .btn-whatsapp:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

<div class="container">
    <h2>List P.O Plastik Surya Abadi</h2>
    
    <form id="poForm">
        <div class="form-group">
            <label for="orderHari">Order Untuk (H+2):</label>
            <select id="orderHari" required>
                <option value="Senin">Senin</option>
                <option value="Selasa">Selasa</option>
                <option value="Rabu">Rabu</option>
                <option value="Kamis">Kamis</option>
                <option value="Jumat">Jumat</option>
                <option value="Sabtu">Sabtu</option>
                <option value="Minggu">Minggu</option>
            </select>
        </div>

        <div class="header-actions">
            <div class="section-title">Kalkulasi (Karung / 25kg)</div>
            <button type="button" id="btnEditPar" class="btn-edit" onclick="toggleEditParstok()">⚙️ Edit Parstok</button>
        </div>
        
        <div class="info-rumus">
            💡 PO = Parstok - Stok Sisa
        </div>

        <!-- Group 1 -->
        <div class="item-row">
            <div class="item-info">10 x 13 x 03</div>
            <div class="input-group">
                <label>Par</label>
                <input type="number" id="par_10x13x03" value="10" min="0" placeholder="0" disabled oninput="hitungOrder()">
            </div>
            <div class="input-group">
                <label>Sisa</label>
                <input type="number" id="stok_10x13x03" placeholder="0" min="0" oninput="hitungOrder()">
            </div>
            <div class="input-group">
                <label style="color:#2563eb">PO</label>
                <input type="number" id="ord_10x13x03" class="est-input" placeholder="0" readonly>
            </div>
        </div>

        <div class="item-row">
            <div class="item-info">13 x 35 x 03</div>
            <div class="input-group">
                <label>Par</label>
                <input type="number" id="par_13x35x03" value="10" min="0" placeholder="0" disabled oninput="hitungOrder()">
            </div>
            <div class="input-group">
                <label>Sisa</label>
                <input type="number" id="stok_13x35x03" placeholder="0" min="0" oninput="hitungOrder()">
            </div>
            <div class="input-group">
                <label style="color:#2563eb">PO</label>
                <input type="number" id="ord_13x35x03" class="est-input" placeholder="0" readonly>
            </div>
        </div>

        <div class="item-row">
            <div class="item-info">30 x 45 x 03</div>
            <div class="input-group">
                <label>Par</label>
                <input type="number" id="par_30x45x03" value="10" min="0" placeholder="0" disabled oninput="hitungOrder()">
            </div>
            <div class="input-group">
                <label>Sisa</label>
                <input type="number" id="stok_30x45x03" placeholder="0" min="0" oninput="hitungOrder()">
            </div>
            <div class="input-group">
                <label style="color:#2563eb">PO</label>
                <input type="number" id="ord_30x45x03" class="est-input" placeholder="0" readonly>
            </div>
        </div>

        <hr class="section-divider">

        <!-- Group 2 -->
        <div class="item-row">
            <div class="item-info">13 x 35 x 06</div>
            <div class="input-group">
                <label>Par</label>
                <input type="number" id="par_13x35x06" value="10" min="0" placeholder="0" disabled oninput="hitungOrder()">
            </div>
            <div class="input-group">
                <label>Sisa</label>
                <input type="number" id="stok_13x35x06" placeholder="0" min="0" oninput="hitungOrder()">
            </div>
            <div class="input-group">
                <label style="color:#2563eb">PO</label>
                <input type="number" id="ord_13x35x06" class="est-input" placeholder="0" readonly>
            </div>
        </div>

        <div class="item-row">
            <div class="item-info">50 x 53 x 06</div>
            <div class="input-group">
                <label>Par</label>
                <input type="number" id="par_50x53x06" value="10" min="0" placeholder="0" disabled oninput="hitungOrder()">
            </div>
            <div class="input-group">
                <label>Sisa</label>
                <input type="number" id="stok_50x53x06" placeholder="0" min="0" oninput="hitungOrder()">
            </div>
            <div class="input-group">
                <label style="color:#2563eb">PO</label>
                <input type="number" id="ord_50x53x06" class="est-input" placeholder="0" readonly>
            </div>
        </div>

        <hr class="section-divider">

        <!-- Group 3 -->
        <div class="item-row">
            <div class="item-info">13 x 30 x 06</div>
            <div class="input-group">
                <label>Par</label>
                <input type="number" id="par_13x30x06" value="10" min="0" placeholder="0" disabled oninput="hitungOrder()">
            </div>
            <div class="input-group">
                <label>Sisa</label>
                <input type="number" id="stok_13x30x06" placeholder="0" min="0" oninput="hitungOrder()">
            </div>
            <div class="input-group">
                <label style="color:#2563eb">PO</label>
                <input type="number" id="ord_13x30x06" class="est-input" placeholder="0" readonly>
            </div>
        </div>

        <div class="item-row">
            <div class="item-info">45 x 53 x 06</div>
            <div class="input-group">
                <label>Par</label>
                <input type="number" id="par_45x53x06" value="10" min="0" placeholder="0" disabled oninput="hitungOrder()">
            </div>
            <div class="input-group">
                <label>Sisa</label>
                <input type="number" id="stok_45x53x06" placeholder="0" min="0" oninput="hitungOrder()">
            </div>
            <div class="input-group">
                <label style="color:#2563eb">PO</label>
                <input type="number" id="ord_45x53x06" class="est-input" placeholder="0" readonly>
            </div>
        </div>

        <button type="button" class="btn-whatsapp" onclick="kirimKeWhatsApp()">Kirim Rekapan ke WhatsApp</button>
    </form>
</div>

<script>
    const group1 = ['10x13x03', '13x35x03', '30x45x03'];
    const group2 = ['13x35x06', '50x53x06'];
    const group3 = ['13x30x06', '45x53x06'];
    const ukuranList = [...group1, ...group2, ...group3];

    let isEditingParstok = false;

    window.onload = function() {
        setHariOtomatis();
        
        ukuranList.forEach(uk => {
            const savedPar = localStorage.getItem('par_' + uk);
            if (savedPar !== null) {
                document.getElementById('par_' + uk).value = savedPar;
            }
        });
        hitungOrder();
    };

    function setHariOtomatis() {
        const namaHari = ["Minggu", "Senin", "Selasa", "Rabu", "Kamis", "Jumat", "Sabtu"];
        const hariIni = new Date();
        hariIni.setDate(hariIni.getDate() + 2);
        document.getElementById('orderHari').value = namaHari[hariIni.getDay()];
    }

    function getWaktuGreeting() {
        const hour = new Date().getHours();
        if (hour >= 4 && hour < 11) return "Selamat Pagi Bu,";
        if (hour >= 11 && hour < 15) return "Selamat Siang Bu,";
        if (hour >= 15 && hour < 18) return "Selamat Sore Bu,";
        return "Selamat Malam Bu,";
    }

    function toggleEditParstok() {
        isEditingParstok = !isEditingParstok;
        const btn = document.getElementById('btnEditPar');

        ukuranList.forEach(uk => {
            const input = document.getElementById('par_' + uk);
            input.disabled = !isEditingParstok;
            
            if (!isEditingParstok) {
                input.style.backgroundColor = 'transparent';
                localStorage.setItem('par_' + uk, input.value);
            } else {
                input.style.backgroundColor = '#f3f4f6';
            }
        });

        if (isEditingParstok) {
            btn.innerText = '💾 Simpan';
            btn.classList.add('active');
        } else {
            btn.innerText = '⚙️ Edit Parstok';
            btn.classList.remove('active');
            hitungOrder();
        }
    }

    function hitungOrder() {
        ukuranList.forEach(uk => {
            const par = parseInt(document.getElementById('par_' + uk).value) || 0;
            const stok = parseInt(document.getElementById('stok_' + uk).value) || 0;
            let hasil = par - stok;
            if (hasil < 0) hasil = 0;
            
            // Set ke value kosong jika 0, sehingga placeholder yang muncul
            if (hasil === 0) {
                document.getElementById('ord_' + uk).value = "";
            } else {
                document.getElementById('ord_' + uk).value = hasil;
            }
        });
    }

    function processGroupText(groupArray) {
        let text = "";
        let count = 0;
        groupArray.forEach(uk => {
            const orderVal = parseInt(document.getElementById('ord_' + uk).value) || 0;
            if (orderVal > 0) {
                const totalKg = orderVal * 25;
                text += `- ${uk} : ${totalKg}\n`;
                count += orderVal;
            }
        });
        return { text: text, count: count };
    }

    function kirimKeWhatsApp() {
        if (isEditingParstok) {
            toggleEditParstok();
        }

        const hari = document.getElementById('orderHari').value;
        const greeting = getWaktuGreeting(); 
        
        const g1 = processGroupText(group1);
        const g2 = processGroupText(group2);
        const g3 = processGroupText(group3);
        
        const totalOrderKarung = g1.count + g2.count + g3.count;

        if (totalOrderKarung === 0) {
            alert('Semua estimasi order bernilai 0. Tidak ada pesanan yang akan dikirim!');
            return;
        }

        let rincianPesan = "";
        if (g1.count > 0) rincianPesan += g1.text;
        
        if (g2.count > 0) {
            if (rincianPesan !== "") rincianPesan += `------------------\n`;
            rincianPesan += g2.text;
        }
        
        if (g3.count > 0) {
            if (rincianPesan !== "") rincianPesan += `------------------\n`;
            rincianPesan += g3.text;
        }

        let pesan = `${greeting}\n\n` +
                    `*List P.O Plastik*\n` +
                    `Untuk Hari *${hari}*\n\n` +
                    `Rincian Rekapan Order:\n` +
                    rincianPesan + `\n` +
                    `Terima kasih!`;

        let urlWhatsApp = `https://api.whatsapp.com/send?text=${encodeURIComponent(pesan)}`;
        window.open(urlWhatsApp, '_blank');
    }
</script>

</body>
</html>
