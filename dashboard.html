<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dashboard - SBR Putra</title>
    <style>
        /* --- PENGATURAN VARIABEL WARNA (TEMA) --- */
        :root {
            --bg-color: #f4f7f6;          
            --text-main: #333333;         
            --text-sub: #666666;          
            --box-bg: #ffffff;            
            --box-active: #e5e7eb;        
            --shadow-color: rgba(0,0,0,0.05);
            --modal-overlay: rgba(0,0,0,0.4);
            --btn-primary: #3b82f6;
            --btn-primary-active: #2563eb;
        }

        /* 1. Tema Gelap Otomatis dari Sistem HP */
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #111827;      
                --text-main: #f9fafb;     
                --text-sub: #9ca3af;      
                --box-bg: #1f2937;        
                --box-active: #374151;    
                --shadow-color: rgba(0,0,0,0.25);
                --modal-overlay: rgba(0,0,0,0.7);
            }
        }

        /* 2. Class untuk Paksa Tema (Manual via Tombol) */
        body.dark-theme {
            --bg-color: #111827;
            --text-main: #f9fafb;
            --text-sub: #9ca3af;
            --box-bg: #1f2937;
            --box-active: #374151;
            --shadow-color: rgba(0,0,0,0.25);
            --modal-overlay: rgba(0,0,0,0.7);
        }

        body.light-theme {
            --bg-color: #f4f7f6;          
            --text-main: #333333;         
            --text-sub: #666666;          
            --box-bg: #ffffff;            
            --box-active: #e5e7eb;        
            --shadow-color: rgba(0,0,0,0.05);
            --modal-overlay: rgba(0,0,0,0.4);
        }

        /* --- STYLING UTAMA --- */
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent; 
        }
        
        body { 
            font-family: sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-main);
            margin: 0; 
            padding: 20px; 
            overflow-x: hidden; 
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        .container {
            max-width: 800px; 
            margin: 0 auto; 
            position: relative;
        }

        /* --- STYLING TOMBOL KONTROL (TEMA & VIEW) --- */
        .top-controls {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-bottom: -15px; /* Menarik ke atas agar proporsional dengan header */
            z-index: 10;
            position: relative;
        }

        .icon-btn {
            background: var(--box-bg);
            border: none;
            font-size: 18px;
            padding: 8px 12px;
            border-radius: 8px;
            color: var(--text-main);
            box-shadow: 0 2px 5px var(--shadow-color);
            cursor: pointer;
            transition: transform 0.1s, background-color 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .icon-btn:active {
            transform: scale(0.9);
            background: var(--box-active);
        }
        
        .header { 
            text-align: center; 
            margin-bottom: 25px; 
        }
        
        .header h2 { 
            color: var(--text-main); 
            margin: 0 0 5px 0; 
            font-size: 24px; 
            transition: color 0.4s ease;
        }
        
        .header p { 
            color: var(--text-sub); 
            margin: 0; 
            font-size: 14px; 
            transition: color 0.4s ease;
        }
        
        /* --- STYLING MENU GRID (3 KOLOM) --- */
        .menu-grid { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); /* Tiga menu ke pinggir di HP */
            gap: 12px; 
            transition: all 0.3s ease;
        }
        
        .menu-box { 
            background: var(--box-bg); 
            padding: 12px 8px; 
            border-radius: 12px; 
            text-align: center; 
            box-shadow: 0 4px 6px var(--shadow-color); 
            text-decoration: none; 
            color: var(--text-main); 
            font-weight: bold; 
            font-size: 11px; /* Ukuran font disesuaikan agar muat 3 kolom */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            aspect-ratio: 1 / 1; 
            transition: transform 0.1s ease, background-color 0.4s ease, color 0.4s ease, box-shadow 0.4s ease;
        }
        
        .menu-box:active { 
            background: var(--box-active); 
            transform: scale(0.95); 
        }
        
        .icon { 
            font-size: 26px; /* Ikon sedikit diperkecil */
            margin-bottom: 8px; 
        }

        /* --- STYLING MENU LIST (DAFTAR CARD KE BAWAH) --- */
        .menu-grid.list-view {
            grid-template-columns: 1fr; /* Satu menu lebar penuh */
            gap: 10px;
        }

        .menu-grid.list-view .menu-box {
            aspect-ratio: auto; /* Membuang rasio kotak */
            flex-direction: row;
            justify-content: flex-start;
            padding: 15px 20px;
            font-size: 14px;
            text-align: left;
        }

        .menu-grid.list-view .icon {
            margin-bottom: 0;
            margin-right: 15px;
            font-size: 28px;
        }
        
        .logout-btn {
            display: block;
            width: 100%;
            max-width: 400px; 
            margin: 30px auto 0 auto; 
            padding: 15px; 
            background: #dc2626; 
            color: white;
            text-align: center;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 15px;
            transition: background-color 0.1s ease, transform 0.1s ease;
        }

        .logout-btn:active {
            background: #b91c1c; 
            transform: scale(0.98);
        }

        /* --- STYLING MODAL PIN CUSTOM --- */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--modal-overlay);
            backdrop-filter: blur(3px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            visibility: hidden;
            opacity: 0;
            transition: visibility 0.2s, opacity 0.2s;
        }

        .modal-overlay.show {
            visibility: visible;
            opacity: 1;
        }

        .modal-box {
            background: var(--box-bg);
            padding: 25px 20px;
            border-radius: 16px;
            width: 90%;
            max-width: 320px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            transform: translateY(-20px) scale(0.95);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal-overlay.show .modal-box {
            transform: translateY(0) scale(1);
        }

        .modal-box h3 {
            margin: 0 0 15px 0;
            color: var(--text-main);
            font-size: 18px;
        }

        .modal-box input {
            width: 100%;
            padding: 15px;
            font-size: 28px;
            text-align: center;
            letter-spacing: 15px;
            border: 2px solid var(--box-active);
            border-radius: 10px;
            background: transparent;
            color: var(--text-main);
            outline: none;
            margin-bottom: 10px;
            transition: border-color 0.2s;
        }

        .modal-box input:focus {
            border-color: var(--btn-primary);
        }

        .modal-error {
            color: #dc2626;
            font-size: 13px;
            margin: 0 0 15px 0;
            min-height: 15px;
            display: none;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
        }

        .modal-buttons button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            transition: transform 0.1s, background-color 0.1s;
        }

        .modal-buttons button:active {
            transform: scale(0.95);
        }

        .btn-cancel {
            background: var(--box-active);
            color: var(--text-main);
        }

        .btn-submit {
            background: var(--btn-primary);
            color: white;
        }

        .btn-submit:active {
            background: var(--btn-primary-active);
        }

        @media (min-width: 768px) {
            .menu-grid { grid-template-columns: repeat(4, 1fr); gap: 20px; }
            /* Desktop list view override */
            .menu-grid.list-view { grid-template-columns: repeat(2, 1fr); } 
            .menu-box { font-size: 15px; }
            .icon { font-size: 40px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- TOMBOL KONTROL -->
        <div class="top-controls">
            <button id="btnView" class="icon-btn" title="Ganti Tampilan">📄</button>
            <button id="btnTheme" class="icon-btn" title="Ganti Tema">☀️</button>
        </div>

        <div class="header">
            <h2>SBR Putra</h2>
            <p>Kkurnia System 2026 V.1.2</p>
        </div>

        <div id="menuGrid" class="menu-grid">
            <a href="kasbon-tukang.html" class="menu-box">
                <span class="icon">💸</span>
                Kasbon Tukang
            </a>
             <!-- Menu yang dikunci (memiliki class 'butuh-pin') -->
            <a href="Belanja_Renovasi.html" class="menu-box butuh-pinn">
                <span class="icon">👷‍♂️</span>
                Catatan Proyek
            </a>
            <a href="dashboard11.html" class="menu-box butuh-pin">
                <span class="icon">📝</span>
                REG SBR
            </a>
            <a href="Rekap-kirim.html" class="menu-box">
                <span class="icon">🚐</span>
                Rekap Kirim
            </a>            
            <a href="Cetak_Print_Bluetooth" class="menu-box">
                <span class="icon">🧾</span>
                Print AsaL
            </a>
            <a href="kiriman_jambi.html" class="menu-box">
                <span class="icon">📋</span>
                Kirim Jambi
            </a>
            <a href="invoice_rnd.html" class="menu-box">
                <span class="icon">📑</span>
                RnD Inv
            </a>
            <a href="nota_pembayaran_supplier.html" class="menu-box">
                <span class="icon">📚</span>
                Supplier Rekap
            </a>
            <a href="manajemen_data.html" class="menu-box">
                <span class="icon">👑</span>
                Manajemen Data
            </a>            
            <a href="basreng.html" class="menu-box">
                <span class="icon">🔥</span>
                Basreng Kiwari 
            </a>
            <a href="lapsimping.html" class="menu-box">
                <span class="icon">📑</span>
                Lap. Simping
            </a>
            <a href="empit.html" class="menu-box">
                <span class="icon">💖</span>
                Catatan Empit
            </a>  
        </div>

        <a href="index.html" class="logout-btn">Keluar (Logout)</a>
    </div>

    <!-- STRUKTUR HTML MODAL PIN -->
    <div id="pinModal" class="modal-overlay">
        <div class="modal-box">
            <h3>Masukkan PIN</h3>
            <input type="password" id="pinInput" inputmode="numeric" maxlength="4" placeholder="••••">
            <p id="pinError" class="modal-error">PIN Salah!</p>
            <div class="modal-buttons">
                <button id="btnCancel" class="btn-cancel">Batal</button>
                <button id="btnSubmit" class="btn-submit">Buka</button>
            </div>
        </div>
    </div>

    <script>
        // 1. Script mendeteksi akses langsung
        if(document.referrer === "") {
            console.log("Halaman diakses langsung.");
        }

        // 2. SCRIPT KONTROL TEMA (DARK/LIGHT MODE)
        const btnTheme = document.getElementById('btnTheme');
        
        // Deteksi tema awal (berdasarkan jam atau preferensi OS)
        const jamSekarang = new Date().getHours();
        const mulaiMalam = 18;
        const mulaiPagi = 6;
        let isDarkMode = (jamSekarang >= mulaiMalam || jamSekarang < mulaiPagi) || window.matchMedia('(prefers-color-scheme: dark)').matches;
        
        // Set tema awal dan ikonnya
        if (isDarkMode) {
            document.body.classList.add('dark-theme');
            btnTheme.innerText = '☀️';
        } else {
            btnTheme.innerText = '🌙';
        }

        btnTheme.addEventListener('click', () => {
            isDarkMode = !isDarkMode;
            if (isDarkMode) {
                document.body.classList.remove('light-theme');
                document.body.classList.add('dark-theme');
                btnTheme.innerText = '☀️'; // Ikon menuju mode terang
            } else {
                document.body.classList.remove('dark-theme');
                document.body.classList.add('light-theme');
                btnTheme.innerText = '🌙'; // Ikon menuju mode gelap
            }
        });

        // 3. SCRIPT KONTROL TAMPILAN (GRID/LIST)
        const btnView = document.getElementById('btnView');
        const menuGridContainer = document.getElementById('menuGrid');
        let isListView = false;

        btnView.addEventListener('click', () => {
            isListView = !isListView;
            if (isListView) {
                menuGridContainer.classList.add('list-view');
                btnView.innerText = '🔲'; // Ikon untuk kembali ke mode Grid (Kotak-kotak)
            } else {
                menuGridContainer.classList.remove('list-view');
                btnView.innerText = '📄'; // Ikon untuk kembali ke mode Daftar
            }
        });

        // 4. Script untuk Custom Modal PIN
        const PIN_RAHASIA = "5000"; 
        let linkTujuan = ""; 

        const daftarMenu = document.querySelectorAll('.menu-box');
        const modal = document.getElementById('pinModal');
        const inputPin = document.getElementById('pinInput');
        const pesanError = document.getElementById('pinError');
        const tombolBatal = document.getElementById('btnCancel');
        const tombolBuka = document.getElementById('btnSubmit');

        // Fungsi membuka modal
        daftarMenu.forEach(function(menu) {
            menu.addEventListener('click', function(event) {
                if (this.classList.contains('butuh-pin')) {
                    event.preventDefault(); 
                    linkTujuan = this.getAttribute('href'); 
                    
                    inputPin.value = "";
                    pesanError.style.display = "none";
                    
                    modal.classList.add('show');
                    
                    setTimeout(() => inputPin.focus(), 100);
                }
            });
        });

        // Fungsi menutup modal
        function tutupModal() {
            modal.classList.remove('show');
            inputPin.value = ""; 
        }

        // Fungsi memvalidasi PIN
        function validasiPin() {
            if (inputPin.value === PIN_RAHASIA) {
                window.location.href = linkTujuan;
            } else {
                pesanError.style.display = "block";
                inputPin.value = "";
                inputPin.focus(); 
            }
        }

        tombolBatal.addEventListener('click', tutupModal);
        tombolBuka.addEventListener('click', validasiPin);

        inputPin.addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                validasiPin();
            }
        });
    </script>
</body>
</html>
