<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dashboard - SBR Putra</title>
    <!-- Menggunakan Phosphor Icons untuk tampilan modern -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        /* --- PENGATURAN VARIABEL WARNA (TEMA MODERN) --- */
        :root {
            --bg-color: #f8fafc;          
            --text-main: #0f172a;         
            --text-sub: #64748b;          
            --box-bg: #ffffff;            
            --box-hover: #f1f5f9;
            --box-active: #e2e8f0;        
            --border-color: #e2e8f0;
            --shadow-color: rgba(0,0,0,0.05);
            --shadow-hover: 0 10px 15px -3px rgba(0,0,0,0.08), 0 4px 6px -4px rgba(0,0,0,0.04);
            --modal-overlay: rgba(15, 23, 42, 0.6);
            --btn-primary: #3b82f6;
            --btn-primary-active: #2563eb;
            --btn-danger: #ef4444;
            --btn-danger-hover: #dc2626;
        }

        /* Tema Gelap Modern (Slate) */
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #0f172a;      
                --text-main: #f8fafc;     
                --text-sub: #94a3b8;      
                --box-bg: #1e293b;        
                --box-hover: #334155;
                --box-active: #475569;    
                --border-color: #334155;
                --shadow-color: rgba(0,0,0,0.3);
                --shadow-hover: 0 10px 15px -3px rgba(0,0,0,0.4), 0 4px 6px -4px rgba(0,0,0,0.2);
                --modal-overlay: rgba(0,0,0,0.8);
            }
        }

        body.dark-theme {
            --bg-color: #0f172a; --text-main: #f8fafc; --text-sub: #94a3b8; 
            --box-bg: #1e293b; --box-hover: #334155; --box-active: #475569; 
            --border-color: #334155; --shadow-color: rgba(0,0,0,0.3); 
            --shadow-hover: 0 10px 15px -3px rgba(0,0,0,0.4), 0 4px 6px -4px rgba(0,0,0,0.2);
            --modal-overlay: rgba(0,0,0,0.8);
        }

        body.light-theme {
            --bg-color: #f8fafc; --text-main: #0f172a; --text-sub: #64748b; 
            --box-bg: #ffffff; --box-hover: #f1f5f9; --box-active: #e2e8f0; 
            --border-color: #e2e8f0; --shadow-color: rgba(0,0,0,0.05);
            --shadow-hover: 0 10px 15px -3px rgba(0,0,0,0.08), 0 4px 6px -4px rgba(0,0,0,0.04);
            --modal-overlay: rgba(15, 23, 42, 0.6);
        }

        /* --- STYLING UTAMA --- */
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent; 
        }
        
        body { 
            font-family: 'Inter', system-ui, -apple-system, sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-main);
            margin: 0; 
            padding: 20px; 
            overflow-x: hidden; 
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        .container {
            max-width: 900px; 
            margin: 0 auto; 
            position: relative;
        }

        /* --- STYLING TOMBOL KONTROL --- */
        .top-controls {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-bottom: -10px; 
            z-index: 10;
            position: relative;
        }

        .icon-btn {
            background: var(--box-bg);
            border: 1px solid var(--border-color);
            font-size: 20px;
            padding: 10px;
            border-radius: 10px;
            color: var(--text-main);
            box-shadow: 0 2px 5px var(--shadow-color);
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .icon-btn:hover { background: var(--box-hover); transform: translateY(-2px); }
        .icon-btn:active { transform: scale(0.95); background: var(--box-active); }
        
        .header { 
            text-align: center; 
            margin-bottom: 35px; 
        }
        
        .header h2 { 
            color: var(--text-main); 
            margin: 0 0 8px 0; 
            font-size: 28px; 
            font-weight: 800;
            letter-spacing: -0.5px;
            transition: color 0.4s ease;
        }
        
        .header p { 
            color: var(--text-sub); 
            margin: 0; 
            font-size: 14px; 
            font-weight: 500;
            transition: color 0.4s ease;
        }
        
        /* --- STYLING MENU GRID --- */
        .menu-grid { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 16px; 
            transition: all 0.3s ease;
        }
        
        .menu-box { 
            background: var(--box-bg); 
            padding: 20px 12px; 
            border: 1px solid var(--border-color);
            border-radius: 16px; 
            text-align: center; 
            box-shadow: 0 2px 4px var(--shadow-color); 
            text-decoration: none; 
            color: var(--text-main); 
            font-weight: 600; 
            font-size: 13px; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            aspect-ratio: 1 / 1; 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        @media (hover: hover) {
            .menu-box:hover {
                transform: translateY(-5px);
                box-shadow: var(--shadow-hover);
                border-color: var(--btn-primary);
                color: var(--btn-primary);
            }
            .menu-box:hover .icon { color: var(--btn-primary); }
        }
        
        .menu-box:active { 
            background: var(--box-active); 
            transform: scale(0.96); 
        }
        
        .icon { 
            font-size: 38px; 
            margin-bottom: 12px; 
            color: var(--text-sub);
            transition: color 0.3s ease;
        }

        /* --- STYLING MENU LIST (TAMPILAN BARIS) --- */
        .menu-grid.list-view {
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .menu-grid.list-view .menu-box {
            aspect-ratio: auto; 
			flex-direction: row;
			justify-content: flex-start;
			padding: 12px 10px; /* Padding diperkecil agar teks muat di layar HP */
			font-size: 12px; /* Ukuran font diperkecil sedikit */
			text-align: left;
        }

        .menu-grid.list-view .icon {
            margin-bottom: 0;
            margin-right: 12px;
            font-size: 24px;
        }
        
        .logout-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            max-width: 400px; 
            margin: 40px auto 20px auto; 
            padding: 16px; 
            background: var(--btn-danger); 
            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 15px;
            box-shadow: 0 4px 6px rgba(239, 68, 68, 0.2);
            transition: all 0.2s ease;
        }

        .logout-btn:hover { background: var(--btn-danger-hover); transform: translateY(-2px); }
        .logout-btn:active { transform: scale(0.98); box-shadow: none; }

        /* --- STYLING MODAL PIN --- */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--modal-overlay);
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            visibility: hidden;
            opacity: 0;
            transition: visibility 0.3s, opacity 0.3s;
        }

        .modal-overlay.show {
            visibility: visible;
            opacity: 1;
        }

        .modal-box {
            background: var(--box-bg);
            padding: 30px 24px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            width: 90%;
            max-width: 340px;
            text-align: center;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            transform: translateY(-20px) scale(0.95);
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .modal-overlay.show .modal-box {
            transform: translateY(0) scale(1);
        }

        .modal-box h3 {
            margin: 0 0 20px 0;
            color: var(--text-main);
            font-size: 20px;
            font-weight: 700;
        }

        .modal-box input {
            width: 100%;
            padding: 16px;
            font-size: 32px;
            font-weight: bold;
            text-align: center;
            letter-spacing: 20px;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            background: var(--bg-color);
            color: var(--text-main);
            outline: none;
            margin-bottom: 12px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .modal-box input:focus {
            border-color: var(--btn-primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        .modal-error {
            color: var(--btn-danger);
            font-size: 14px;
            font-weight: 500;
            margin: 0 0 20px 0;
            min-height: 20px;
            display: none;
        }

        .modal-buttons {
            display: flex;
            gap: 12px;
        }

        .modal-buttons button {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-cancel {
            background: var(--box-active);
            color: var(--text-main);
        }
        .btn-cancel:hover { background: #d1d5db; }

        .btn-submit {
            background: var(--btn-primary);
            color: white;
            box-shadow: 0 4px 6px rgba(59, 130, 246, 0.3);
        }
        .btn-submit:hover { background: var(--btn-primary-active); transform: translateY(-2px); }
        .btn-submit:active { transform: scale(0.96); box-shadow: none; }

        /* --- RESPONSIVE BREAKPOINTS --- */
        @media (min-width: 600px) {
            .menu-grid { grid-template-columns: repeat(3, 1fr); gap: 20px; }
            .menu-box { font-size: 14px; }
        }

        @media (min-width: 900px) {
            .container { padding: 40px 20px; }
            .menu-grid { grid-template-columns: repeat(4, 1fr); gap: 24px; }
            .menu-grid.list-view { grid-template-columns: repeat(2, 1fr); gap: 20px; } 
            .menu-box { font-size: 15px; padding: 24px 16px; }
            .icon { font-size: 46px; }
            .header h2 { font-size: 34px; }
        }
    </style>
</head>
<body>

    <!-- STRUKTUR HTML MODAL PIN -->
    //<div id="pinModal" class="modal-overlay">
        <div class="modal-box">
            <h3>Masukkan PIN</h3>
            <input type="password" id="pinInput" inputmode="numeric" maxlength="4" placeholder="••••">
            <p id="pinError" class="modal-error">PIN Salah!</p>
            <div class="modal-buttons">
                <button id="btnCancel" class="btn-cancel">Batal</button>
                <button id="btnSubmit" class="btn-submit">Buka</button>
            </div>
        </div>
    </div>

    <script>
        if(document.referrer === "") {
            console.log("Halaman diakses langsung.");
        }

        // ==========================================
        // SCRIPT KONTROL TEMA DENGAN LOCALSTORAGE
        // ==========================================
        const btnTheme = document.getElementById('btnTheme');
        let isDarkMode = false;
        
        // Cek apakah sebelumnya pengguna sudah pernah mengatur tema
        const savedTheme = localStorage.getItem('sbrTheme');

        if (savedTheme) {
            // Jika ada data tersimpan, gunakan itu
            isDarkMode = savedTheme === 'dark';
        } else {
            // Jika belum ada data tersimpan, gunakan aturan jam / OS
            const jamSekarang = new Date().getHours();
            const mulaiMalam = 18;
            const mulaiPagi = 6;
            isDarkMode = (jamSekarang >= mulaiMalam || jamSekarang < mulaiPagi) || window.matchMedia('(prefers-color-scheme: dark)').matches;
        }

        // Fungsi untuk menerapkan tema
        function applyTheme(dark) {
            if (dark) {
                document.body.classList.remove('light-theme');
                document.body.classList.add('dark-theme');
                btnTheme.innerHTML = '<i class="ph ph-sun"></i>';
            } else {
                document.body.classList.remove('dark-theme');
                document.body.classList.add('light-theme');
                btnTheme.innerHTML = '<i class="ph ph-moon"></i>';
            }
        }

        // Terapkan tema saat halaman pertama kali dimuat
        applyTheme(isDarkMode);

        // Event saat tombol tema di-klik
        btnTheme.addEventListener('click', () => {
            isDarkMode = !isDarkMode;
            applyTheme(isDarkMode);
            // Simpan pilihan ke localStorage
            localStorage.setItem('sbrTheme', isDarkMode ? 'dark' : 'light');
        });


        // ==========================================
        // SCRIPT KONTROL TAMPILAN DENGAN LOCALSTORAGE
        // ==========================================
        const btnView = document.getElementById('btnView');
        const menuGridContainer = document.getElementById('menuGrid');
        
        // Cek data tampilan yang tersimpan (Grid/List)
        const savedView = localStorage.getItem('sbrView');
        let isListView = savedView === 'list'; // Jika disave sbg 'list', nilainya true

        // Fungsi untuk menerapkan tampilan
        function applyView(list) {
            if (list) {
                menuGridContainer.classList.add('list-view');
                btnView.innerHTML = '<i class="ph ph-squares-four"></i>';
            } else {
                menuGridContainer.classList.remove('list-view');
                btnView.innerHTML = '<i class="ph ph-list-dashes"></i>';
            }
        }

        // Terapkan tampilan saat halaman pertama dimuat
        applyView(isListView);

        // Event saat tombol tampilan di-klik
        btnView.addEventListener('click', () => {
            isListView = !isListView;
            applyView(isListView);
            // Simpan pilihan ke localStorage
            localStorage.setItem('sbrView', isListView ? 'list' : 'grid');
        });


        // ==========================================
        // SCRIPT MODAL PIN
        // ==========================================
        const PIN_RAHASIA = "5000"; 
        let linkTujuan = ""; 

        const daftarMenu = document.querySelectorAll('.menu-box');
        const modal = document.getElementById('pinModal');
        const inputPin = document.getElementById('pinInput');
        const pesanError = document.getElementById('pinError');
        const tombolBatal = document.getElementById('btnCancel');
        const tombolBuka = document.getElementById('btnSubmit');

        daftarMenu.forEach(function(menu) {
            menu.addEventListener('click', function(event) {
                if (this.classList.contains('butuh-pin')) {
                    event.preventDefault(); 
                    linkTujuan = this.getAttribute('href'); 
                    
                    inputPin.value = "";
                    pesanError.style.display = "none";
                    
                    modal.classList.add('show');
                    
                    setTimeout(() => inputPin.focus(), 100);
                }
            });
        });

        function tutupModal() {
            modal.classList.remove('show');
            inputPin.value = ""; 
        }

        function validasiPin() {
            if (inputPin.value === PIN_RAHASIA) {
                window.location.href = linkTujuan;
            } else {
                pesanError.style.display = "block";
                inputPin.value = "";
                inputPin.focus(); 
            }
        }

        tombolBatal.addEventListener('click', tutupModal);
        tombolBuka.addEventListener('click', validasiPin);

        inputPin.addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                validasiPin();
            }
        });
    </script>
</body>
