<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SBR Kurir Distribusi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen pb-24">

    <!-- ========================================== -->
    <!-- 1. LAYAR LOGIN KHUSUS DISTRIBUSI           -->
    <!-- ========================================== -->
    <div id="screenLogin" class="min-h-screen flex items-center justify-center p-4">
        <div class="w-full max-w-sm bg-white p-6 rounded-3xl shadow-xl border border-slate-100 text-center">
            <div class="w-16 h-16 mx-auto mb-3 bg-indigo-600 text-white rounded-2xl flex items-center justify-center text-2xl shadow-md">
                <i class="fa-solid fa-truck-ramp-box"></i>
            </div>
            <h1 class="text-xl font-extrabold text-slate-900">SBR Putra Food</h1>
            <p class="text-xs font-bold text-indigo-600 uppercase tracking-wider mb-6">Aplikasi Kurir Distribusi</p>

            <form id="formLogin" class="space-y-4 text-left">
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">Nama Kurir</label>
                    <select id="loginKaryawanId" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-bold text-slate-800 outline-none focus:ring-2 focus:ring-indigo-500">
                        <option value="">Pilih Nama Anda...</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">PIN Masuk</label>
                    <input type="password" id="loginPin" maxlength="6" placeholder="••••" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-center text-xl tracking-widest font-black text-slate-800 outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <button type="submit" id="btnLogin" class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white font-bold rounded-xl shadow-md transition text-sm">
                    MASUK SEBAGAI KURIR
                </button>
            </form>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- 2. APLIKASI UTAMA (SETELAH LOGIN)          -->
    <!-- ========================================== -->
    <div id="screenApp" class="hidden">
        <!-- Top Bar Profil -->
        <header class="bg-white px-4 py-3.5 shadow-sm sticky top-0 z-30 flex items-center justify-between border-b border-slate-100">
            <div class="flex items-center gap-2.5">
                <div class="w-9 h-9 bg-indigo-100 text-indigo-700 rounded-xl flex items-center justify-center font-black text-sm">
                    <i class="fa-solid fa-user-check"></i>
                </div>
                <div>
                    <div class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Kurir Aktif</div>
                    <div class="text-sm font-black text-slate-900 leading-tight" id="labelKurirNama">-</div>
                </div>
            </div>
            <button onclick="prosesLogout()" class="w-8 h-8 rounded-lg bg-slate-100 text-slate-500 hover:text-red-600 flex items-center justify-center text-xs transition" title="Keluar">
                <i class="fa-solid fa-arrow-right-from-bracket"></i>
            </button>
        </header>

        <!-- Container Menu Tab Handphone -->
        <main class="max-w-md mx-auto p-4">

            <!-- TAB 1: FORM INPUT KIRIMAN BARANG (MULTI-BARIS BATCH) -->
            <div id="tabKirim" class="space-y-4">
                <div class="bg-white p-5 rounded-3xl shadow-sm border border-slate-100">
                    <h2 class="text-base font-extrabold text-slate-900 pb-3 border-b border-slate-100 flex items-center">
                        <i class="fa-solid fa-paper-plane text-indigo-600 mr-2"></i> Kirim Muatan ke Packing
                    </h2>

                    <form id="formKirimKurir" class="space-y-4 mt-4">
                        <!-- Header Tanggal & Sesi Bersama -->
                        <div class="grid grid-cols-2 gap-3 pb-3 border-b border-slate-100">
                            <div>
                                <label class="block text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-1">Tanggal</label>
                                <input type="date" id="kirimTanggal" required class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-bold outline-none focus:ring-2 focus:ring-indigo-500">
                            </div>
                            <div>
                                <label class="block text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-1">Sesi</label>
                                <select id="kirimSesi" required class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-bold outline-none focus:ring-2 focus:ring-indigo-500">
                                    <option value="Pagi">Pagi</option>
                                    <option value="Sore">Sore</option>
                                </select>
                            </div>
                        </div>

                        <!-- Header Kolom Baris -->
                        <div class="flex items-center gap-2 px-1 text-[10px] font-black text-slate-400 uppercase tracking-wider">
                            <span class="flex-1">Karyawan</span>
                            <span class="w-16 text-center text-blue-600">Kirim</span>
                            <span class="w-20 text-center text-indigo-600">Jenis</span>
                            <span class="w-7 text-center">Aksi</span>
                        </div>

                        <!-- Wadah Baris Dinamis -->
                        <div id="containerRowsKurir" class="space-y-2.5 max-h-[380px] overflow-y-auto pr-1">
                            <!-- 3 Baris default dimuat oleh JavaScript -->
                        </div>

                        <!-- Tombol Tambah Baris -->
                        <button type="button" onclick="tambahBarisInputKurir()" class="w-full py-2.5 border-2 border-dashed border-indigo-200 hover:border-indigo-400 hover:bg-indigo-50/50 text-indigo-600 font-bold rounded-2xl text-xs flex items-center justify-center gap-1.5 transition">
                            <i class="fa-solid fa-circle-plus"></i> Tambah Baris Karyawan
                        </button>

                        <!-- Tombol Submit -->
                        <div class="pt-2">
                            <button type="submit" id="btnSimpanKirim" class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white font-bold rounded-2xl shadow-md transition text-sm flex items-center justify-center gap-2">
                                <i class="fa-solid fa-check"></i> SIMPAN PENGIRIMAN
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- TAB 2: CATAT PENARIKAN BARANG (DENGAN PEMISAH SELESAI HIDE/SHOW) -->
            <div id="tabTarik" class="hidden space-y-4">
                <div class="flex items-center justify-between px-1">
                    <div>
                        <h2 class="text-sm font-extrabold text-slate-900 flex items-center">
                            <i class="fa-solid fa-boxes-packing text-emerald-600 mr-1.5"></i> Antrean Tarik Barang
                        </h2>
                        <p class="text-[11px] text-slate-400">Muatan yang menunggu penarikan atau belum pas</p>
                    </div>
                    <button onclick="loadAntreanTarik()" class="text-xs font-bold text-emerald-700 bg-emerald-50 hover:bg-emerald-100 border border-emerald-200 px-3 py-1.5 rounded-xl transition flex items-center gap-1 active:scale-95">
                        <i class="fa-solid fa-rotate-right"></i> Segarkan
                    </button>
                </div>

                <!-- Bagian 1: Antrean Utama (Belum Ditarik / Sisa Kurang) -->
                <div id="containerAntreanTarik" class="space-y-3">
                    <!-- Dimuat dinamis via JS -->
                </div>

                <!-- Bagian 2: Muatan yang Sudah Selesai/Pas (Bisa di Hide / Show) -->
                <div id="sectionSelesaiTarik" class="hidden pt-2">
                    <button type="button" onclick="toggleSelesaiTarik()" class="w-full py-2.5 px-4 bg-slate-200/70 hover:bg-slate-200 text-slate-600 font-extrabold text-xs rounded-2xl flex items-center justify-between transition select-none">
                        <span class="flex items-center gap-2">
                            <i class="fa-solid fa-circle-check text-emerald-600"></i>
                            <span id="labelJumlahSelesai">Sudah Ditarik (0)</span>
                        </span>
                        <span class="text-[11px] text-indigo-600 flex items-center gap-1">
                            <span id="textToggleSelesai">Tampilkan</span>
                            <i class="fa-solid fa-chevron-down text-xs transition-transform duration-300" id="iconToggleSelesai"></i>
                        </span>
                    </button>

                    <!-- Wadah Kartu yang Sudah Beres (Default Tersembunyi) -->
                    <div id="containerSudahSelesai" class="hidden space-y-2.5 mt-3">
                        <!-- Dimuat dinamis via JS -->
                    </div>
                </div>
            </div>

            <!-- TAB 3: RIWAYAT TUGAS SAYA HARI INI -->
            <div id="tabRiwayatSaya" class="hidden space-y-3">
                <h2 class="text-sm font-extrabold text-slate-900 px-1 flex items-center">
                    <i class="fa-solid fa-list-check text-indigo-600 mr-1.5"></i> Aktivitas Saya Hari Ini
                </h2>
                <div id="containerRiwayatSaya" class="space-y-2.5">
                    <!-- Aktivitas kurir dimuat via JS -->
                </div>
            </div>

        </main>

        <!-- Bottom Navigation Menu Bar (ID Diperbaiki) -->
        <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 px-6 py-2.5 flex justify-around items-center z-40 max-w-md mx-auto shadow-lg">
            <button onclick="navMobile('kirim')" id="btnNavKirim" class="flex flex-col items-center gap-1 text-indigo-600 font-bold text-[10px]">
                <i class="fa-solid fa-paper-plane text-lg"></i> Kirim
            </button>
            <button onclick="navMobile('tarik')" id="btnNavTarik" class="flex flex-col items-center gap-1 text-slate-400 font-semibold text-[10px]">
                <i class="fa-solid fa-box-open text-lg"></i> Tarik
            </button>
            <button onclick="navMobile('riwayatSaya')" id="btnNavRiwayatSaya" class="flex flex-col items-center gap-1 text-slate-400 font-semibold text-[10px]">
                <i class="fa-solid fa-clock-rotate-left text-lg"></i> Tugas Saya
            </button>
        </nav>
    </div>

    <!-- MODAL PENARIKAN DENGAN STATUS REAL-TIME (PAS, KURANG, LEBIH) -->
    <div id="modalSetorKurir" class="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-slate-900/60 backdrop-blur-sm opacity-0 pointer-events-none transition-all duration-300">
        <div class="bg-white rounded-t-3xl sm:rounded-3xl shadow-2xl w-full max-w-sm p-5 space-y-4 transform translate-y-full sm:translate-y-0 transition-all duration-300" id="contentSetorKurir">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 class="font-black text-slate-900 text-sm flex items-center">
                    <i class="fa-solid fa-box-open text-emerald-600 mr-2"></i> Konfirmasi Tarik Barang
                </h3>
                <button onclick="tutupModalTarikKurir()" class="w-7 h-7 bg-slate-100 rounded-full flex items-center justify-center text-xs text-slate-400">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <!-- Info Penerima & Target -->
            <div class="bg-slate-50 p-3.5 rounded-2xl text-xs flex justify-between items-center border border-slate-100">
                <div>
                    <div class="text-[10px] font-bold text-slate-400 uppercase">Karyawan Packing</div>
                    <div class="text-slate-800 font-black text-sm uppercase" id="setorPackingNama">-</div>
                </div>
                <div class="text-right">
                    <div class="text-[10px] font-bold text-slate-400 uppercase">Target Tarik</div>
                    <div class="text-blue-600 font-black text-base leading-none"><span id="setorTarget">0</span> Bal</div>
                </div>
            </div>

            <!-- Input Bal & Kotak Status Real-Time Berdampingan -->
            <div class="grid grid-cols-2 gap-3 items-center">
                <div>
                    <label class="block text-[11px] font-bold text-slate-600 uppercase mb-1 text-center">Jumlah Tarik</label>
                    <input type="number" id="inputTarikBal" min="0" placeholder="0" oninput="hitungStatusTarikKurir()" required class="w-full py-2.5 bg-emerald-50/50 border-2 border-emerald-200 focus:border-emerald-500 rounded-2xl text-center text-2xl font-black text-emerald-700 outline-none transition shadow-inner">
                </div>
                <div>
                    <label class="block text-[11px] font-bold text-slate-600 uppercase mb-1 text-center">Status Hasil</label>
                    <div id="boxStatusKurir" class="h-[46px] rounded-2xl border border-slate-200 bg-slate-50 flex flex-col items-center justify-center text-center p-1">
                        <span id="labelStatusKurir" class="text-xs font-black text-slate-400 uppercase tracking-wider">Menunggu</span>
                        <span id="subStatusKurir" class="text-[9px] font-bold text-slate-400 leading-none"></span>
                    </div>
                </div>
            </div>

            <input type="hidden" id="targetKirimAngka">
            <input type="hidden" id="transaksiIdTarik">

            <button type="button" id="btnSimpanTarikKurir" onclick="simpanTarikKurir()" class="w-full py-3.5 bg-emerald-600 hover:bg-emerald-700 active:scale-95 text-white font-bold rounded-2xl shadow-md text-sm transition">
                <i class="fa-solid fa-check-double mr-1.5"></i> SIMPAN HASIL TARIKAN
            </button>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- LOGIKA JAVASCRIPT APLIKASI KURIR           -->
    <!-- ========================================== -->
    <script>
        const supabaseUrl = 'https://uocvuddqhviorebinpva.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVvY3Z1ZGRxaHZpb3JlYmlucHZhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU2OTQ0NDAsImV4cCI6MjEwMTI3MDQ0MH0.mWGTOTfHG4Q62S3P4LQi-5bGviMPWgMzo2p2AECquL8';
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        let userKurirAktif = null;
        let daftarPackingGlobal = [];

        // FUNGSI FORMAT TANGGAL INDONESIA (Mgg, 13/09/26)
        function formatTglIndo(tglStr) {
            if (!tglStr) return "-";
            const parts = tglStr.split('-');
            if (parts.length !== 3) return tglStr;
            const year = parseInt(parts[0], 10);
            const month = parseInt(parts[1], 10) - 1;
            const day = parseInt(parts[2], 10);
            const d = new Date(year, month, day);
            
            const namaHari = ['Mgg', 'Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab'];
            const hari = namaHari[d.getDay()];
            const dd = String(day).padStart(2, '0');
            const mm = String(month + 1).padStart(2, '0');
            const yy = String(year).slice(-2);
            
            return `${hari}, ${dd}/${mm}/${yy}`;
        }

        // CEK SESI LOGIN
        document.addEventListener('DOMContentLoaded', async () => {
            const savedKurir = localStorage.getItem('sbr_kurir_session');
            await loadDropdownKaryawan();

            if (savedKurir) {
                userKurirAktif = JSON.parse(savedKurir);
                bukaAplikasi();
            }

            const inputTgl = document.getElementById('kirimTanggal');
            if (inputTgl) inputTgl.valueAsDate = new Date();
        });

        // 1. LOAD KARYAWAN (ROLE SIMPEL: 'Distribusi' & 'Packing')
        async function loadDropdownKaryawan() {
            const { data, error } = await supabaseClient
                .from('karyawan')
                .select('*')
                .order('nama', { ascending: true });

            if (error) {
                console.error("Gagal mengambil data karyawan:", error.message);
                return;
            }

            if (data) {
                // Dropdown Login: Hanya staf Distribusi atau Admin
                const selectLogin = document.getElementById('loginKaryawanId');
                if (selectLogin) {
                    selectLogin.innerHTML = '<option value="">Pilih Nama Anda...</option>';
                    data.forEach(k => {
                        const role = (k.role || '').toLowerCase().trim();
                        if (role === 'distribusi' || role === 'admin') {
                            selectLogin.innerHTML += `<option value="${k.id}" data-pin="${k.pin || '1234'}">${k.nama}</option>`;
                        }
                    });
                }

                // Dropdown Penerima Kiriman: Hanya staf Packing
                daftarPackingGlobal = data.filter(k => {
                    const role = (k.role || '').toLowerCase().trim();
                    return role === 'packing' || role === 'karyawan';
                });

                inisialisasiFormMultiBarisKurir();
            }
        }

        // 2. FUNGSI MULTI-BARIS FORM KIRIM
        function inisialisasiFormMultiBarisKurir() {
            const container = document.getElementById('containerRowsKurir');
            if (!container) return;
            container.innerHTML = '';
            for (let i = 0; i < 3; i++) {
                tambahBarisInputKurir();
            }
        }

        function tambahBarisInputKurir() {
            const container = document.getElementById('containerRowsKurir');
            if (!container) return;

            let opsiKaryawan = '<option value="">Pilih...</option>';
            daftarPackingGlobal.forEach(k => {
                opsiKaryawan += `<option value="${k.id}">${k.nama}</option>`;
            });

            const rowDiv = document.createElement('div');
            rowDiv.className = 'baris-kiriman-kurir flex items-center gap-2 bg-white p-1.5 rounded-xl border border-slate-200 shadow-sm transition';
            rowDiv.innerHTML = `
                <select class="input-kurir-karyawan flex-1 px-2.5 py-2 text-xs font-bold text-slate-800 bg-slate-50 rounded-lg border border-slate-200 outline-none focus:ring-2 focus:ring-indigo-500">
                    ${opsiKaryawan}
                </select>

                <input type="number" min="1" placeholder="0" class="input-kurir-bal w-16 px-2 py-2 text-center text-sm font-black text-blue-700 bg-blue-50/50 rounded-lg border border-blue-200 outline-none focus:ring-2 focus:ring-blue-400">

                <select class="input-kurir-jenis w-20 px-2 py-2 text-[11px] font-bold text-slate-700 bg-slate-50 rounded-lg border border-slate-200 outline-none focus:ring-2 focus:ring-indigo-500">
                    <option value="B12">B12</option>
                    <option value="B10">B10</option>
                </select>

                <button type="button" onclick="hapusBarisInputKurir(this)" class="w-7 h-7 flex items-center justify-center text-slate-400 hover:text-red-500 rounded-lg transition" title="Hapus baris">
                    <i class="fa-solid fa-xmark text-xs"></i>
                </button>
            `;
            container.appendChild(rowDiv);
        }

        function hapusBarisInputKurir(btn) {
            const container = document.getElementById('containerRowsKurir');
            if (container.querySelectorAll('.baris-kiriman-kurir').length > 1) {
                btn.closest('.baris-kiriman-kurir').remove();
            } else {
                const row = btn.closest('.baris-kiriman-kurir');
                row.querySelector('.input-kurir-karyawan').value = '';
                row.querySelector('.input-kurir-bal').value = '';
                row.querySelector('.input-kurir-jenis').value = 'B12';
            }
        }

        // 3. SIMPAN BATCH KIRIMAN
        document.getElementById('formKirimKurir').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnSimpanKirim');
            const tanggal = document.getElementById('kirimTanggal').value;
            const sesi = document.getElementById('kirimSesi').value;

            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin mr-1.5"></i> Menyimpan...';

            const rows = document.querySelectorAll('.baris-kiriman-kurir');
            const payloads = [];

            rows.forEach(row => {
                const kid = row.querySelector('.input-kurir-karyawan').value;
                const bal = parseInt(row.querySelector('.input-kurir-bal').value) || 0;
                const jenis = row.querySelector('.input-kurir-jenis').value;

                if (kid && bal > 0) {
                    payloads.push({
                        tanggal: tanggal,
                        sesi: sesi,
                        karyawan_id: kid,
                        kirim_produksi: bal,
                        jenis_produk: jenis,
                        tarik_jadi: 0,
                        koreksi: 0,
                        is_lunas: false,
                        is_lembur: false,
                        dikirim_oleh: userKurirAktif.id
                    });
                }
            });

            if (payloads.length === 0) {
                alert("Harap isi minimal 1 baris nama karyawan packing dan jumlah bal!");
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-check mr-1.5"></i> SIMPAN PENGIRIMAN';
                return;
            }

            const { error } = await supabaseClient.from('distribusi_packing').insert(payloads);

            if (error) {
                alert("Gagal menyimpan kiriman: " + error.message);
            } else {
                alert(`Sukses! Berhasil mencatat ${payloads.length} kiriman atas nama kurir: ${userKurirAktif.nama}`);
                inisialisasiFormMultiBarisKurir();
            }

            btn.disabled = false;
            btn.innerHTML = '<i class="fa-solid fa-check mr-1.5"></i> SIMPAN PENGIRIMAN';
        });

        // 4. LOGIN & LOGOUT
        document.getElementById('formLogin').addEventListener('submit', (e) => {
            e.preventDefault();
            const select = document.getElementById('loginKaryawanId');
            const selectedOpt = select.options[select.selectedIndex];
            const pinInput = document.getElementById('loginPin').value;
            const validPin = selectedOpt.getAttribute('data-pin');

            if (pinInput !== validPin) {
                alert("PIN Salah! Silakan periksa kembali PIN Anda.");
                return;
            }

            userKurirAktif = {
                id: select.value,
                nama: selectedOpt.text
            };

            localStorage.setItem('sbr_kurir_session', JSON.stringify(userKurirAktif));
            bukaAplikasi();
        });

        function bukaAplikasi() {
            document.getElementById('screenLogin').classList.add('hidden');
            document.getElementById('screenApp').classList.remove('hidden');
            document.getElementById('labelKurirNama').innerText = userKurirAktif.nama;
            navMobile('kirim');
        }

        function prosesLogout() {
            if (confirm("Ingin keluar dari sesi kurir?")) {
                localStorage.removeItem('sbr_kurir_session');
                userKurirAktif = null;
                document.getElementById('screenApp').classList.add('hidden');
                document.getElementById('screenLogin').classList.remove('hidden');
                document.getElementById('loginPin').value = '';
            }
        }

        // 5. NAVIGASI MOBILE (DEFENSIF TERHADAP ID NULL)
        function navMobile(tab) {
            ['kirim', 'tarik', 'riwayatSaya'].forEach(t => {
                const view = document.getElementById(`tab${t.charAt(0).toUpperCase() + t.slice(1)}`);
                const btn = document.getElementById(`btnNav${t.charAt(0).toUpperCase() + t.slice(1)}`);
                
                if (view) {
                    if (t === tab) view.classList.remove('hidden');
                    else view.classList.add('hidden');
                }
                
                if (btn) {
                    if (t === tab) {
                        btn.className = "flex flex-col items-center gap-1 text-indigo-600 font-bold text-[10px]";
                    } else {
                        btn.className = "flex flex-col items-center gap-1 text-slate-400 font-semibold text-[10px]";
                    }
                }
            });

            if (tab === 'tarik') loadAntreanTarik();
            if (tab === 'riwayatSaya') loadRiwayatTugasSaya();
        }

        // 6. LOGIKA STATUS REAL-TIME POPUP TARIK
        function hitungStatusTarikKurir() {
            const inputVal = document.getElementById('inputTarikBal').value;
            const target = parseInt(document.getElementById('targetKirimAngka').value) || 0;
            const box = document.getElementById('boxStatusKurir');
            const label = document.getElementById('labelStatusKurir');
            const sub = document.getElementById('subStatusKurir');

            if (inputVal === '' || isNaN(parseInt(inputVal))) {
                box.className = 'h-[46px] rounded-2xl border border-slate-200 bg-slate-50 flex flex-col items-center justify-center text-center p-1';
                label.className = 'text-xs font-black text-slate-400 uppercase tracking-wider';
                label.innerText = 'Menunggu';
                sub.innerText = '';
                return;
            }

            const tarik = parseInt(inputVal);
            const selisih = tarik - target;

            if (selisih === 0) {
                box.className = 'h-[46px] rounded-2xl border border-emerald-300 bg-emerald-50 flex flex-col items-center justify-center text-center p-1 shadow-sm';
                label.className = 'text-xs font-black text-emerald-700 uppercase tracking-wider';
                label.innerText = 'PAS';
                sub.className = 'text-[9px] font-bold text-emerald-600';
                sub.innerText = 'Target Beres';
            } else if (selisih < 0) {
                box.className = 'h-[46px] rounded-2xl border border-amber-300 bg-amber-50 flex flex-col items-center justify-center text-center p-1 shadow-sm';
                label.className = 'text-[11px] font-black text-amber-700 uppercase tracking-wider';
                label.innerText = 'Belum Selesai';
                sub.className = 'text-[9px] font-bold text-amber-600';
                sub.innerText = `Kurang ${Math.abs(selisih)} Bal`;
            } else {
                box.className = 'h-[46px] rounded-2xl border border-purple-300 bg-purple-50 flex flex-col items-center justify-center text-center p-1 shadow-sm';
                label.className = 'text-[11px] font-black text-purple-700 uppercase tracking-wider';
                label.innerText = 'Lebih';
                sub.className = 'text-[9px] font-bold text-purple-600';
                sub.innerText = `Lebih +${selisih} Bal`;
            }
        }

        function bukaModalTarikKurir(id, nama, target, nilaiTarikLama = 0) {
            document.getElementById('transaksiIdTarik').value = id;
            document.getElementById('setorPackingNama').innerText = nama;
            document.getElementById('setorTarget').innerText = target;
            document.getElementById('targetKirimAngka').value = target;

            const input = document.getElementById('inputTarikBal');
            input.value = nilaiTarikLama > 0 ? nilaiTarikLama : '';
            
            hitungStatusTarikKurir();

            const modal = document.getElementById('modalSetorKurir');
            modal.classList.remove('opacity-0', 'pointer-events-none');
            document.getElementById('contentSetorKurir').classList.remove('translate-y-full');
            setTimeout(() => input.focus(), 150);
        }

        function tutupModalTarikKurir() {
            const modal = document.getElementById('modalSetorKurir');
            modal.classList.add('opacity-0', 'pointer-events-none');
            document.getElementById('contentSetorKurir').classList.add('translate-y-full');
        }

        function toggleSelesaiTarik() {
            const container = document.getElementById('containerSudahSelesai');
            const icon = document.getElementById('iconToggleSelesai');
            const text = document.getElementById('textToggleSelesai');

            if (container.classList.contains('hidden')) {
                container.classList.remove('hidden');
                icon.classList.add('rotate-180');
                text.innerText = 'Tutup';
            } else {
                container.classList.add('hidden');
                icon.classList.remove('rotate-180');
                text.innerText = 'Tampilkan';
            }
        }

        // 7. LOAD ANTREAN TARIK (QUERY JOIN & PEMISAH SELESAI)
        async function loadAntreanTarik() {
            const containerBelum = document.getElementById('containerAntreanTarik');
            const containerSudah = document.getElementById('containerSudahSelesai');
            const sectionSelesai = document.getElementById('sectionSelesaiTarik');
            const labelJumlahSelesai = document.getElementById('labelJumlahSelesai');

            if (!containerBelum) return;

            containerBelum.innerHTML = `
                <div class="p-8 text-center bg-white rounded-3xl border border-slate-100 shadow-sm space-y-3">
                    <div class="w-10 h-10 mx-auto bg-emerald-50 text-emerald-600 rounded-full flex items-center justify-center text-lg shadow-inner">
                        <i class="fa-solid fa-circle-notch fa-spin"></i>
                    </div>
                    <div class="text-xs font-bold text-slate-600">Memuat antrean barang...</div>
                </div>
            `;
            if (containerSudah) containerSudah.innerHTML = '';
            if (sectionSelesai) sectionSelesai.classList.add('hidden');

            const { data, error } = await supabaseClient
                .from('distribusi_packing')
                .select('*, karyawan!karyawan_id(nama)')
                .eq('is_lunas', false)
                .order('tanggal', { ascending: false });

            if (error) {
                containerBelum.innerHTML = `<div class="p-4 text-center text-xs text-red-500 font-bold bg-white rounded-2xl border border-red-100">Error: ${error.message}</div>`;
                return;
            }

            if (!data || data.length === 0) {
                containerBelum.innerHTML = `
                    <div class="p-8 text-center text-xs text-slate-400 bg-white rounded-3xl border border-slate-100 shadow-sm space-y-1">
                        <i class="fa-solid fa-boxes-packing text-2xl text-slate-300 mb-1"></i>
                        <div class="font-bold text-slate-600">Tidak Ada Antrean</div>
                        <div>Semua pengiriman sudah selesai dan terbayar lunas.</div>
                    </div>
                `;
                return;
            }

            const antreanBelumBeres = [];
            const sudahBeres = [];

            data.forEach(item => {
                const target = item.jenis_produk === 'B10' ? Math.round(item.kirim_produksi * 1.2) : item.kirim_produksi;
                const belumTarik = (item.tarik_jadi || 0) === 0;
                const selisih = item.koreksi || 0;

                if (belumTarik || selisih < 0) {
                    antreanBelumBeres.push({ ...item, target });
                } else {
                    sudahBeres.push({ ...item, target });
                }
            });

            containerBelum.innerHTML = '';
            if (antreanBelumBeres.length === 0) {
                containerBelum.innerHTML = `
                    <div class="p-6 text-center text-xs bg-emerald-50 text-emerald-800 font-bold rounded-2xl border border-emerald-200">
                        <i class="fa-solid fa-circle-check text-base mb-1"></i>
                        <div>Luar biasa! Semua antrean muatan sudah ditarik pas.</div>
                    </div>
                `;
            } else {
                antreanBelumBeres.forEach(item => {
                    const belumTarik = (item.tarik_jadi || 0) === 0;
                    const selisih = item.koreksi || 0;

                    let badgeStatus = belumTarik
                        ? `<span class="text-[10px] font-extrabold bg-amber-50 text-amber-700 border border-amber-200 px-2 py-0.5 rounded-md">Belum Ditarik</span>`
                        : `<span class="text-[10px] font-extrabold bg-red-50 text-red-700 border border-red-200 px-2 py-0.5 rounded-md">Kurang ${Math.abs(selisih)} Bal</span>`;

                    containerBelum.innerHTML += `
                        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex items-center justify-between gap-3">
                            <div class="space-y-0.5">
                                <div class="text-[10px] font-bold text-slate-400">${formatTglIndo(item.tanggal)} • Sesi ${item.sesi}</div>
                                <div class="text-sm font-black text-slate-900 uppercase">${item.karyawan?.nama || '-'}</div>
                                <div class="text-xs font-bold text-indigo-600">Aromanis ${item.jenis_produk} <span class="text-slate-400 font-normal">(Target: ${item.target} Bal)</span></div>
                                <div class="pt-0.5">${badgeStatus}</div>
                            </div>
                            <button onclick="bukaModalTarikKurir('${item.id}', '${item.karyawan?.nama || '-'}', ${item.target}, ${item.tarik_jadi || 0})" class="px-3.5 py-2.5 bg-emerald-600 hover:bg-emerald-700 active:scale-95 text-white font-bold text-xs rounded-xl shadow-sm transition whitespace-nowrap">
                                <i class="fa-solid fa-box-open mr-1"></i> ${belumTarik ? 'Tarik' : 'Koreksi'}
                            </button>
                        </div>
                    `;
                });
            }

            if (sudahBeres.length > 0 && sectionSelesai && containerSudah) {
                sectionSelesai.classList.remove('hidden');
                labelJumlahSelesai.innerText = `Sudah Selesai Ditarik (${sudahBeres.length})`;

                sudahBeres.forEach(item => {
                    const selisih = item.koreksi || 0;
                    const badgeSelesai = selisih === 0
                        ? `<span class="text-[9px] font-extrabold bg-emerald-50 text-emerald-700 border border-emerald-200 px-2 py-0.5 rounded">PAS (${item.tarik_jadi} Bal)</span>`
                        : `<span class="text-[9px] font-extrabold bg-purple-50 text-purple-700 border border-purple-200 px-2 py-0.5 rounded">LEBIH +${selisih} Bal</span>`;

                    containerSudah.innerHTML += `
                        <div class="bg-white/80 p-3 rounded-xl border border-slate-200/60 flex items-center justify-between gap-2">
                            <div>
                                <div class="text-[10px] text-slate-400 font-semibold">${formatTglIndo(item.tanggal)} • Sesi ${item.sesi}</div>
                                <div class="text-xs font-bold text-slate-700 uppercase">${item.karyawan?.nama || '-'}</div>
                            </div>
                            <div class="flex items-center gap-2">
                                ${badgeSelesai}
                                <button onclick="bukaModalTarikKurir('${item.id}', '${item.karyawan?.nama || '-'}', ${item.target}, ${item.tarik_jadi || 0})" class="w-7 h-7 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-lg text-xs flex items-center justify-center transition" title="Edit jika salah input">
                                    <i class="fa-solid fa-pen"></i>
                                </button>
                            </div>
                        </div>
                    `;
                });
            }
        }

        // 8. SIMPAN TARIKAN KURIR
        async function simpanTarikKurir() {
            const id = document.getElementById('transaksiIdTarik').value;
            const target = parseInt(document.getElementById('targetKirimAngka').value) || 0;
            const tarik = parseInt(document.getElementById('inputTarikBal').value);

            if (isNaN(tarik) || tarik < 0) {
                alert("Masukkan angka setoran yang valid!");
                return;
            }

            const koreksi = tarik - target;

            const { error } = await supabaseClient
                .from('distribusi_packing')
                .update({
                    tarik_jadi: tarik,
                    koreksi: koreksi,
                    ditarik_oleh: userKurirAktif.id
                })
                .eq('id', id);

            if (error) {
                alert("Gagal mencatat penarikan: " + error.message);
            } else {
                alert(`Berhasil dicatat atas nama kurir: ${userKurirAktif.nama}`);
                tutupModalTarikKurir();
                loadAntreanTarik();
            }
        }

        // ==============================================================
        // 9. RIWAYAT TUGAS SAYA (STABIL & MENDUKUNG TANGGAL PENARIKAN)
        // ==============================================================
        async function loadRiwayatTugasSaya() {
            const container = document.getElementById('containerRiwayatSaya');
            if (!container) return;

            if (!userKurirAktif || !userKurirAktif.id) {
                container.innerHTML = `
                    <div class="p-6 text-center text-xs text-red-500 bg-white rounded-2xl border border-red-100">
                        Sesi login kurir tidak ditemukan. Silakan logout dan login kembali.
                    </div>
                `;
                return;
            }

            container.innerHTML = `
                <div class="p-8 text-center bg-white rounded-3xl border border-slate-100 shadow-sm space-y-3">
                    <div class="w-10 h-10 mx-auto bg-indigo-50 text-indigo-600 rounded-full flex items-center justify-center text-lg shadow-inner">
                        <i class="fa-solid fa-circle-notch fa-spin"></i>
                    </div>
                    <div class="text-xs font-bold text-slate-600">Memuat riwayat tugas kurir...</div>
                </div>
            `;

            try {
                // Ambil data kiriman dan tarikan secara paralel agar kueri aman dan cepat
                const [resKirim, resTarik] = await Promise.all([
                    supabaseClient
                        .from('distribusi_packing')
                        .select('*, karyawan!karyawan_id(nama)')
                        .eq('dikirim_oleh', userKurirAktif.id)
                        .order('tanggal', { ascending: false }),
                    supabaseClient
                        .from('distribusi_packing')
                        .select('*, karyawan!karyawan_id(nama)')
                        .eq('ditarik_oleh', userKurirAktif.id)
                        .order('tanggal', { ascending: false })
                ]);

                if (resKirim.error) throw resKirim.error;
                if (resTarik.error) throw resTarik.error;

                // Gabungkan kedua data dan hilangkan duplikasi berdasarkan ID transaksi
                const mapData = new Map();
                (resKirim.data || []).forEach(item => mapData.set(item.id, item));
                (resTarik.data || []).forEach(item => mapData.set(item.id, item));

                const listAktivitas = Array.from(mapData.values());

                if (listAktivitas.length === 0) {
                    container.innerHTML = `
                        <div class="p-8 text-center text-xs text-slate-400 bg-white rounded-3xl border border-slate-100 shadow-sm space-y-1">
                            <i class="fa-solid fa-clipboard-check text-3xl text-slate-300 mb-2"></i>
                            <div class="font-bold text-slate-600">Belum Ada Aktivitas</div>
                            <div>Belum ada data barang yang Anda kirim atau tarik.</div>
                        </div>
                    `;
                    return;
                }

                // Hitung total akumulasi kirim dan tarik
                let totalKirim = 0;
                let totalTarik = 0;
                const rekapPacking = {};

                listAktivitas.forEach(row => {
                    const kid = row.karyawan_id;
                    const nama = row.karyawan?.nama || 'Tanpa Nama';
                    const isKirim = (row.dikirim_oleh === userKurirAktif.id);
                    const isTarik = (row.ditarik_oleh === userKurirAktif.id);

                    const kVal = isKirim ? (row.kirim_produksi || 0) : 0;
                    const tVal = isTarik ? (row.tarik_jadi || 0) : 0;

                    totalKirim += kVal;
                    totalTarik += tVal;

                    if (!rekapPacking[kid]) {
                        rekapPacking[kid] = { nama: nama, kirim: 0, tarik: 0 };
                    }
                    rekapPacking[kid].kirim += kVal;
                    rekapPacking[kid].tarik += tVal;
                });

                // Susun ringkasan per karyawan packing
                let htmlPacking = '';
                Object.values(rekapPacking).forEach(item => {
                    htmlPacking += `
                        <div class="bg-white p-3.5 rounded-2xl border border-slate-100 shadow-sm flex items-center justify-between">
                            <div class="flex items-center gap-2.5">
                                <div class="w-8 h-8 rounded-xl bg-indigo-50 text-indigo-600 flex items-center justify-center font-black text-xs">
                                    <i class="fa-solid fa-user"></i>
                                </div>
                                <div>
                                    <div class="text-xs font-black text-slate-900 uppercase">${item.nama}</div>
                                    <div class="text-[10px] text-slate-400 font-semibold">Tugas Terselesaikan</div>
                                </div>
                            </div>
                            <div class="flex items-center gap-2 text-right">
                                <div class="px-2.5 py-1 bg-blue-50 border border-blue-100 rounded-lg">
                                    <div class="text-[9px] font-bold text-blue-600 uppercase">Kirim</div>
                                    <div class="text-xs font-black text-blue-700">${item.kirim} <span class="text-[9px] font-normal">Bal</span></div>
                                </div>
                                <div class="px-2.5 py-1 bg-emerald-50 border border-emerald-100 rounded-lg">
                                    <div class="text-[9px] font-bold text-emerald-600 uppercase">Tarik</div>
                                    <div class="text-xs font-black text-emerald-700">${item.tarik} <span class="text-[9px] font-normal">Bal</span></div>
                                </div>
                            </div>
                        </div>
                    `;
                });

                // Susun baris riwayat detail
                let htmlDetail = '';
                listAktivitas.forEach(row => {
                    const isKirim = (row.dikirim_oleh === userKurirAktif.id);
                    const isTarik = (row.ditarik_oleh === userKurirAktif.id);

                    let badge = '';
                    if (isKirim && isTarik) badge = '<span class="text-[9px] font-bold bg-indigo-100 text-indigo-700 px-2 py-0.5 rounded-md">Kirim & Tarik</span>';
                    else if (isKirim) badge = '<span class="text-[9px] font-bold bg-blue-100 text-blue-700 px-2 py-0.5 rounded-md">Pengirim</span>';
                    else if (isTarik) badge = '<span class="text-[9px] font-bold bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded-md">Penarik</span>';

                    htmlDetail += `
                        <div class="bg-white/90 p-3 rounded-xl border border-slate-100 flex items-center justify-between gap-2">
                            <div>
                                <div class="text-[10px] text-slate-400 font-semibold">${formatTglIndo(row.tanggal)} • Sesi ${row.sesi}</div>
                                <div class="text-xs font-black text-slate-800 uppercase">${row.karyawan?.nama || '-'}</div>
                                <div class="text-[11px] text-slate-500 font-medium">
                                    Kirim: <b class="text-blue-600">${row.kirim_produksi || 0}</b> | Setor: <b class="text-emerald-600">${row.tarik_jadi || 0}</b> Bal
                                </div>
                            </div>
                            <div>${badge}</div>
                        </div>
                    `;
                });

                // Render tampilan utuh ke DOM
                container.innerHTML = `
                    <div class="grid grid-cols-2 gap-2.5">
                        <div class="bg-gradient-to-br from-blue-600 to-indigo-600 text-white p-3.5 rounded-2xl shadow-sm text-center">
                            <div class="text-[10px] font-bold uppercase tracking-wider text-blue-100">Total Kirim</div>
                            <div class="text-xl font-black mt-0.5">${totalKirim} <span class="text-xs font-semibold">Bal</span></div>
                        </div>
                        <div class="bg-gradient-to-br from-emerald-600 to-teal-600 text-white p-3.5 rounded-2xl shadow-sm text-center">
                            <div class="text-[10px] font-bold uppercase tracking-wider text-emerald-100">Total Tarik</div>
                            <div class="text-xl font-black mt-0.5">${totalTarik} <span class="text-xs font-semibold">Bal</span></div>
                        </div>
                    </div>

                    <div class="space-y-2 pt-1">
                        <div class="text-xs font-black text-slate-700 uppercase tracking-wide px-1">
                            Ringkasan per Karyawan Packing:
                        </div>
                        <div class="space-y-2">
                            ${htmlPacking}
                        </div>
                    </div>

                    <div class="space-y-2 pt-2">
                        <div class="text-xs font-black text-slate-700 uppercase tracking-wide px-1">
                            Rincian Transaksi:
                        </div>
                        <div class="space-y-2">
                            ${htmlDetail}
                        </div>
                    </div>
                `;

            } catch (err) {
                console.error("Gagal memuat tugas saya:", err);
                container.innerHTML = `
                    <div class="p-4 text-center text-xs text-red-500 font-bold bg-white rounded-2xl border border-red-100">
                        Terjadi kesalahan: ${err.message}
                    </div>
                `;
            }
        }
    </script>
